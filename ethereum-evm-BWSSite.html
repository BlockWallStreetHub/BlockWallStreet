title:"What Ethereum Is and Why It Matters",
sub:"Smart contracts, accounts, ETH and the idea of a shared computer that no single company runs.",
lesson:`
<h3>Start with a vending machine</h3>
<p>A vending machine is a tiny, honest robot. You put in the money, press a button, and the machine follows its rules. It does not care who you are. It does not need a cashier. If you paid enough, it gives you the snack.</p>
<p>Now imagine a vending machine that does not sell snacks. It can hold money, lend it out, swap one kind of money for another, or hand out tickets. Anyone in the world can use it, and no one can secretly change the rules. That is a good way to picture a <b>smart contract</b>, and smart contracts are what make Ethereum different from Bitcoin.</p>

<h3>Bitcoin and Ethereum: two different jobs</h3>
<p>Bitcoin was built to be digital money that is hard to change and hard to stop. Ethereum was built to be a shared computer. It still has money, called <b>ether</b> or <b>ETH</b>. But on top of that, it lets people publish small programs that everyone can run and no one can quietly edit. Ethereum was proposed by Vitalik Buterin and a group of co-founders and went live in July 2015.</p>
<p>One simple way to remember it: Bitcoin is like digital gold that you hold. Ethereum is like a digital city where things get built. Both are useful. They do different jobs.</p>

<h3>The two kinds of accounts</h3>
<p>Ethereum has two kinds of accounts. An <b>externally owned account</b>, often shortened to <b>EOA</b>, belongs to a person. It is controlled by a secret key, just like the wallets you may have used before. A <b>contract account</b> holds a program. Nobody holds a key to a contract. It simply runs its code when someone sends it a transaction.</p>
<p>Both kinds of account have an <b>address</b>. An Ethereum address is a long string that starts with <b>0x</b> followed by 40 letters and numbers. Remember that "0x" start. You will see it on every network in this course.</p>

<h3>What is a smart contract, really?</h3>
<p>A smart contract is a program stored on the blockchain. It has a few simple parts: some saved information, called its state, and some functions, which are actions people can call. For example, a token contract might keep a list of who owns how many tokens and have an action called "transfer."</p>
<p>The word "smart" is a little misleading. These programs are not intelligent. They do exactly what their code says, no more and no less. They are not legal contracts, either. They are code. The strength is that the rules are public and anyone can check them. The danger is that a mistake in the code can cost real money, and on a blockchain, mistakes are very hard to undo.</p>

<h3>The Ethereum Virtual Machine</h3>
<p>Every computer needs a way to run programs. On Ethereum that engine is called the <b>Ethereum Virtual Machine</b>, or <b>EVM</b>. Think of it as a shared set of instructions that every Ethereum computer follows the same way, so that everyone gets the same result from the same program.</p>
<p>This idea turned out to be very important. Many other blockchains copied the EVM so that programs written for Ethereum would also run on them. When a network does this, people call it <b>EVM-compatible</b> or just an <b>EVM network</b>. The programming language most people use is called <b>Solidity</b>. This course is about Ethereum and the most popular EVM networks: Base, Arbitrum, Optimism, BNB Chain, Avalanche and Robinhood Chain.</p>

<h3>Why do people care?</h3>
<p>Smart contracts let people build things that used to need a company in the middle. Examples include swapping tokens without a broker, lending and borrowing without a bank, issuing digital collectibles, and creating stablecoins, which are tokens built to hold a steady value. All of this is called <b>decentralized finance</b>, or <b>DeFi</b>, when it involves money services. You will meet each idea in later sections.</p>

<h3>Where ETH fits in</h3>
<p>ETH is the native coin of Ethereum. People use it to pay fees, which you will learn about in Section 2. It is also used as collateral in many DeFi apps, and it is what validators lock up to help secure the network. Calling ETH only a "coin" is too small. It is the fuel for the shared computer.</p>

<h3>A healthy dose of caution</h3>
<p>Because anyone can publish a smart contract, anyone can also publish a bad one. Some are mistakes and some are scams. A busy, open platform has both great builders and bad actors. Throughout this course, you will learn how to tell the difference and how to protect yourself. This course is education, not financial advice.</p>
`,

title:"How Ethereum Works: Gas, Staking and Upgrades",
sub:"Validators, 12-second slots, why you pay gas, how fees get burned and what the big upgrades did.",
lesson:`
<h3>From mining to staking</h3>
<p>Early on, Ethereum used proof of work, like Bitcoin. Computers raced to solve puzzles, and the winner added the next page of the ledger. On September 15, 2022, in an event called <b>The Merge</b>, Ethereum switched to <b>proof of stake</b>. After that date, there was no more mining on Ethereum, and the network used far less energy.</p>
<p>In proof of stake, <b>validators</b> lock up ETH as a deposit, called a <b>stake</b>. The usual minimum to run a validator is 32 ETH. The system picks validators to propose new pages, called <b>blocks</b>, and other validators vote to confirm them. Honest work earns rewards. A validator who cheats can lose part of the stake, and that punishment is called <b>slashing</b>. The idea is simple: it should cost more to attack the network than you could ever gain.</p>
<p>In May 2025, the Pectra upgrade let a single validator hold more than 32 ETH, up to 2,048 ETH, which makes large operations easier to manage. Most regular people do not run their own validator. They stake through an exchange, a pool, or a staking service, which carries its own risks and fees.</p>

<h3>Slots, epochs and finality</h3>
<p>Ethereum keeps time in <b>slots</b> of 12 seconds. A new block is meant to arrive in each slot. Thirty-two slots make an <b>epoch</b>, about 6.4 minutes. When enough validators vote across two epochs, a block becomes <b>finalized</b>, which takes about 13 minutes. Finalized means it would take a huge amount of stake to undo it. Many wallets show your transaction as done in seconds, but true finality takes longer.</p>

<h3>What is gas?</h3>
<p>Every action on Ethereum uses a little computing work, and that work costs money. The price of that work is called <b>gas</b>. A simple ETH transfer uses a small amount of gas. A complicated action, like swapping tokens through several contracts, uses much more. This is why different actions cost different amounts.</p>
<p>Gas is measured in <b>gwei</b>. One ETH equals one billion gwei, so a gwei is a tiny slice of ETH. Your fee is the amount of gas your action uses multiplied by the price per unit of gas. A simple transfer uses 21,000 units of gas. If the price is 10 gwei, the fee is 210,000 gwei, which is 0.00021 ETH. You will practice this math in the bonus calculator.</p>

<h3>The base fee, the tip and the burn</h3>
<p>Since an upgrade in August 2021 called <b>EIP-1559</b>, a fee has two parts. The <b>base fee</b> is set by the network and goes up when blocks are busy and down when they are quiet. The base fee is <b>burned</b>, meaning it is destroyed. The second part is a <b>tip</b>, which goes to the validator and encourages them to include your transaction faster. Because of burning, when the network is busy more ETH is destroyed than created, which can make the supply of ETH shrink. When the network is quiet, supply can grow slightly because of staking rewards. ETH does not have a fixed maximum supply like Bitcoin does.</p>

<h3>Why fees can be high</h3>
<p>The base layer of Ethereum has limited room in each block. When many people want to use it at once, they compete, and the base fee rises. That is one major reason other networks and scaling solutions exist, which is the story of the next sections.</p>

<h3>Upgrades: how Ethereum changes</h3>
<p>Ethereum changes through coordinated upgrades called <b>hard forks</b>, where all the software teams agree on a date. Here are a few you should know:</p>
<p><b>The Merge (September 2022)</b> moved Ethereum to proof of stake. <b>Dencun (March 2024)</b> added <b>blobs</b>, a cheaper kind of data space meant for layer 2 networks. <b>Pectra (May 2025)</b> improved staking and wallet features. <b>Fusaka (December 3, 2025)</b> expanded blob capacity with a technique called PeerDAS, aimed at lowering costs for layer 2 networks further.</p>
<p>The next big upgrade is called <b>Glamsterdam</b>. As of the latest reports I found, it was being tested on public test networks, with a first test fork on the Sepolia testnet scheduled for October 6, 2026, and no firm date set for mainnet. Check the Ethereum Foundation's blog for the latest status before you rely on any date. Developers have said they now plan upgrades roughly twice a year, though schedules often slip.</p>

<h3>Ethereum is slow on purpose</h3>
<p>People sometimes say Ethereum is "slow." It is better to say Ethereum puts security and broad participation first. The base layer is the settlement court. Faster, cheaper activity is meant to happen on other networks that settle back to it.</p>

title:"Tokens, Standards and DeFi Basics",
sub:"ERC-20, NFTs, stablecoins, swapping, lending and the one setting that trips up beginners: approvals.",
lesson:`
<h3>Coins versus tokens</h3>
<p>A <b>coin</b> is the native money of a blockchain, like ETH on Ethereum. A <b>token</b> is a different kind of asset that lives inside a smart contract on a blockchain. Anyone can create a token. A token might stand for a dollar, a share in a project, a game item or a vote.</p>

<h3>The standards that made it easy</h3>
<p>Ethereum developers agreed on shared recipes for tokens. These recipes are called <b>ERC standards</b>, short for "Ethereum Request for Comments." Because everyone follows the same recipe, wallets and apps can handle thousands of tokens without custom work. You should know three:</p>
<p><b>ERC-20</b> is the recipe for tokens where every unit is the same, like dollars. Stablecoins such as USDC and USDT are ERC-20 tokens on many networks. <b>ERC-721</b> is the recipe for one-of-a-kind items, the standard behind most NFTs. <b>ERC-1155</b> lets one contract hold both kinds, which games like because they can have many copies of an item.</p>
<p>These standards work on Ethereum and on the other EVM networks in this course, because they all run the same kind of code.</p>

<h3>A token is a contract address</h3>
<p>Here is a key idea. A token is not defined by its name. It is defined by the <b>contract address</b> where it lives. Anyone can create a token called "USDC." The real one lives at one specific address on each network. A fake could have the same name, the same logo and a different address. Always get the address from the issuer's official website, and compare it before you trade or hold.</p>

<h3>Wrapped ETH</h3>
<p>ETH is a coin, not an ERC-20 token, so many apps cannot handle it the same way. The fix is <b>wrapped ETH</b>, or <b>WETH</b>. You deposit ETH into a contract and get one WETH for each ETH. You can swap it back at any time. Think of it as ETH in a standard jacket so apps can accept it.</p>

<h3>Swapping on a decentralized exchange</h3>
<p>A <b>decentralized exchange</b>, or <b>DEX</b>, lets you swap tokens directly from your wallet without handing money to a company. Many use an <b>automated market maker</b>, or <b>AMM</b>. An AMM is a pool of two tokens held in a smart contract. A formula sets the price based on how much of each token is in the pool. People who add tokens to the pool, called <b>liquidity providers</b>, earn a share of fees. Uniswap is the best-known example, and it runs on many of the networks in this course.</p>
<p>When you swap, you can set <b>slippage</b>, the most price movement you will accept between clicking and the swap finishing. Too low and the swap may fail. Too high and you could be hit by an unfavorable price.</p>

<h3>Lending and borrowing</h3>
<p>In DeFi lending, people deposit tokens into a pool and earn interest. Others borrow from the pool, but they must lock up more value than they borrow, called <b>over-collateralization</b>. If the value of the collateral drops too far, the system sells it automatically in a <b>liquidation</b> to protect lenders. Aave is a widely used example. Borrowing is risky, because a sharp price drop can wipe out your collateral quickly.</p>

<h3>Approvals: the setting that trips people up</h3>
<p>Before a contract can move your ERC-20 tokens, you must give it permission. This is called an <b>approval</b>. When you press "Approve," you are saying that a certain contract may spend up to a certain amount of a certain token from your wallet. Many apps ask for an <b>unlimited approval</b> to save you from approving each time. That is convenient, but it means that if the contract is ever hacked, or if you approved a scam contract, someone could drain that token from your wallet without asking again.</p>
<p>Two habits protect you. First, read the approval screen. Second, from time to time, review and revoke approvals you no longer use. Free tools exist for this, and block explorers have a section for it. Approvals are a big theme of Section 9.</p>

<h3>Why this matters for the rest of the course</h3>
<p>Everything you just learned works the same on Base, Arbitrum, Optimism, BNB Chain, Avalanche and Robinhood Chain. That is the beauty of the EVM: learn it once and use it on many networks. The details that change from network to network are the fee token, the speed, the security design and who runs it.</p>
`,

title:"Why So Many Networks: Layer 2s, Rollups and Bridges",
sub:"The scaling problem, what a rollup is, optimistic versus ZK, blobs, sidechains and what EVM-compatible really means.",
lesson:`
<h3>The crowded highway problem</h3>
<p>Picture one highway into a big city. When traffic is light, you glide through. At rush hour, everyone is stuck, and the toll goes up. Ethereum's base layer, often called <b>layer 1</b> or <b>L1</b>, is like that highway. It is secure and trusted, but it has limited room. Fees rise when many people want in.</p>
<p>The answer was not just to widen the one highway. It was to build more roads that connect to it. Those extra roads are the reason there are so many networks in this course.</p>

<h3>Three kinds of networks</h3>
<p>It helps to sort the networks into three groups.</p>
<p><b>Layer 1s (L1s)</b> are independent blockchains with their own validators and their own security. Ethereum is one. So are BNB Chain and Avalanche's C-Chain. If an independent L1 has a problem, Ethereum is not there to back it up.</p>
<p><b>Layer 2s (L2s)</b> run on their own but post their records back to Ethereum and rely on Ethereum for security. Base, Arbitrum One, OP Mainnet and Robinhood Chain are all L2s. The goal is to get cheaper and faster transactions while keeping Ethereum's safety as the backstop.</p>
<p><b>Sidechains</b> are separate blockchains with their own security that are linked by a bridge. The XRPL EVM Sidechain is one example. A sidechain does not inherit the security of the chain it connects to.</p>

<h3>How a rollup works</h3>
<p>The most common kind of L2 is a <b>rollup</b>. A rollup collects hundreds or thousands of user transactions, runs them on its own fast system, then "rolls them up" into a compressed bundle and posts that bundle to Ethereum. The cost of one Ethereum posting is shared by everyone in the bundle, so each person pays much less.</p>
<p>Someone has to put the transactions in order. That job belongs to a computer called the <b>sequencer</b>. Most rollups today have one main sequencer, run by the team that built the network. That is fast and simple, but it is also a point of centralization. If the sequencer goes offline, normal use stops, though rollups have escape routes that let users get their funds out through Ethereum.</p>

<h3>Optimistic versus ZK rollups</h3>
<p>How does Ethereum know that the bundle is honest? There are two main approaches.</p>
<p>An <b>optimistic rollup</b> assumes the bundle is honest unless someone proves otherwise. Anyone can submit a <b>fraud proof</b> during a challenge window, usually about seven days. Arbitrum One and OP Mainnet use this approach. A side effect is that withdrawing your funds back to Ethereum through the official bridge normally takes about seven days. Fast third-party bridges can speed this up for a fee.</p>
<p>A <b>ZK rollup</b> attaches a mathematical proof, called a <b>validity proof</b>, that the bundle is correct. No long waiting period is needed. ZK rollups are more technically complex, and this approach is growing. Some networks are working to add ZK proofs to their designs.</p>

<h3>Blobs: why L2 fees dropped</h3>
<p>Rollups must post their data to Ethereum so that anyone can check it. Before March 2024, that data was stored in the expensive part of Ethereum. The Dencun upgrade added <b>blobs</b>, a cheaper type of temporary data space built for rollups. Fees on L2s fell sharply. The Fusaka upgrade in December 2025 expanded blob capacity again. When you pay on an L2, your fee has two parts: the small cost to run your transaction, and your share of the cost of posting data to Ethereum.</p>

<h3>How safe is an L2? The stages</h3>
<p>A group called L2BEAT rates rollups by "stages." <b>Stage 0</b> means training wheels are still heavy. <b>Stage 1</b> means the rollup has a working proof system and users can leave without the operator's permission, though a security council can step in for emergencies. <b>Stage 2</b> means the code is in charge and the council's power is limited to provable bugs. As of the reports I found, Arbitrum One, OP Mainnet and Base were rated Stage 1. Ratings change, so check L2BEAT yourself.</p>

<h3>What does EVM-compatible mean for you?</h3>
<p>Every network in this course can run Ethereum-style programs, so your wallet address works on all of them. But each one is its own network with its own <b>chain ID</b>, its own fee token and its own copy of every token. The same address on two networks holds different balances. Switching networks in your wallet is like switching to a different bank branch that happens to use the same account number.</p>

<h3>Bridges</h3>
<p>A <b>bridge</b> moves value between networks. Usually it locks your asset on one network and creates a matching asset on the other. A bridge is only as safe as its design and code. Bridges have been some of the biggest targets for hackers in crypto. Section 8 and 9 cover how to use them carefully.</p>
`,

title:"Base and Optimism",
sub:"Coinbase's L2, the OP Stack and the Superchain idea, and why Base is changing its foundation.",
lesson:`
<h3>Meet Optimism</h3>
<p><b>Optimism</b> is an L2 network and a group of builders who created a software kit called the <b>OP Stack</b>. The main network is called <b>OP Mainnet</b>. It is an optimistic rollup, which means it uses the fraud-proof model from Section 4. It launched publicly in 2021. A major upgrade called Bedrock arrived in mid-2023, and in June 2024 its permissionless fault proofs went live on OP Mainnet, a step toward a more trustless design.</p>
<p>Optimism's big idea was the <b>Superchain</b>: many networks built from the same OP Stack kit that share standards and work together, so moving between them can be smooth. The token <b>OP</b> is used for governance, meaning voting on the project's decisions. Gas on OP Mainnet is paid in ETH, not OP. The chain ID of OP Mainnet is 10.</p>

<h3>Meet Base</h3>
<p><b>Base</b> is an L2 incubated by Coinbase, the large US crypto exchange. It launched in August 2023, built on the OP Stack. Gas is paid in ETH. Its chain ID is 8453. Because Coinbase can send its huge base of users to Base, the network grew very fast, and many reports describe it as the largest Ethereum L2 by activity. Coinbase has said it treats Base as an open platform for builders.</p>
<p>What makes Base popular? It is easy for newcomers to reach, since Coinbase customers can move funds to it, and it is cheap to use. It hosts apps for trading, payments, social features, creator tools, and tokens of every quality, from serious projects to jokes to scams. Because it is so easy to launch tokens there, you must be extra careful about what you buy.</p>
<p>Base has not launched its own network token as of the reports I found. Leaders have said they are exploring one. Be very careful with any "Base token" you see advertised, since scammers love this kind of rumor.</p>

<h3>A big change: Base is leaving the OP Stack</h3>
<p>On February 18, 2026, the Base team announced that it would move to its own "unified" software stack run by Base itself, and step away from the Optimism Superchain. They said this would let them ship upgrades faster, with more frequent network upgrades. Reports also said the plan included swapping the fraud-proof design for a different proof approach using trusted hardware or ZK proofs, and that Optimism would be removed from Base's security council.</p>
<p>The news mattered because Base was by far the largest network in the Superchain, and the Superchain's shared revenue model had depended on it. The OP token fell in price after the announcement. What it means for the Superchain is a debate. Supporters of the move say focused teams ship faster. Critics say it weakens the idea of shared networks. For you as a user, the key point is that these networks are businesses and projects that change direction, so their designs and their risks change too.</p>
<p>Because details of the transition keep evolving, check Base's official blog and L2BEAT for the current status.</p>

<h3>How Optimism and Base compare</h3>
<p>Both are optimistic rollups at heart, pay gas in ETH and are EVM-compatible. OP Mainnet is the original and governed by the Optimism community. Base is run by Coinbase's team and is much bigger by usage. The difference to remember: one is a community-governed network that wants many chains to join, and the other is a company-backed network focused on its own growth.</p>

<h3>Using them as a beginner</h3>
<p>To use either, add the network to your wallet or let the wallet add it for you. Bring in a little ETH to pay gas, and send a small test amount first. If you move funds through the official bridge from Ethereum, deposits are fairly quick, but withdrawals through the official bridge take about a week. Remember that your balance on Base is separate from your balance on Optimism and on Ethereum.</p>
`,

title:"Arbitrum and Robinhood Chain",
sub:"Arbitrum One, Nitro, BoLD, Stylus and Orbit chains, and how Robinhood built its own chain for tokenized stocks.",
lesson:`
<h3>Meet Arbitrum</h3>
<p><b>Arbitrum</b> is a family of Ethereum L2 networks built by a company called Offchain Labs. The main network, <b>Arbitrum One</b>, launched in 2021 and became one of the busiest places for DeFi. Like OP Mainnet, it is an optimistic rollup, so withdrawals to Ethereum through the official bridge take about a week. Gas is paid in ETH. Its chain ID is 42161.</p>
<p>Arbitrum has its own token, <b>ARB</b>, launched in March 2023 along with the <b>Arbitrum DAO</b>, a community group that votes on decisions. ARB is used for governance. It is not the gas token.</p>

<h3>The Arbitrum toolkit</h3>
<p>A few names to know. <b>Nitro</b> is the main software engine that runs Arbitrum chains. <b>BoLD</b> is a newer dispute system, short for Bounded Liquidity Delay, that lets anyone challenge a bad state, which means no special permission is needed to act as a watchdog. BoLD helped Arbitrum One reach Stage 1 in the L2BEAT framework, which you learned in Section 4. <b>Stylus</b> lets developers write smart contracts in languages other than Solidity, such as Rust, and run them alongside normal EVM contracts.</p>
<p>The most important one for this section is <b>Orbit</b>. Orbit is a kit that lets anyone launch their own custom chain built with Arbitrum technology. Companies use it to get a chain tuned for their needs, with their own rules, while using tried and tested software. There are dozens of Orbit chains today. A chain that uses Orbit can choose to settle to Ethereum, which makes it an L2 like Robinhood Chain, or to settle to Arbitrum One. When a large Orbit chain pays a share of its revenue back to the Arbitrum community, that is called a licence fee.</p>

<h3>Why Robinhood built a chain</h3>
<p>Robinhood is a large US brokerage app that serves millions of customers. A traditional stock market is closed at night and on weekends. A blockchain never closes. Robinhood saw a chance to offer <b>tokenized stocks</b>, tokens that track the price of a real share, so people could trade around the clock. In June 2025 it launched an early version of these Stock Tokens on Arbitrum One for customers in Europe. It then built its own dedicated chain.</p>

<h3>Robinhood Chain: the facts</h3>
<p><b>Robinhood Chain</b> is an Ethereum L2 built using Arbitrum Orbit and running the Nitro engine. Its public test network launched in February 2026, and the main network went live on <b>July 1, 2026</b>, at a Robinhood event in London. Gas is paid in ETH. Reports say Robinhood has not announced a native token for the chain. Its chain ID is 4663 on mainnet and 46630 on the test network. Launch partners and integrations reported at the time included Alchemy, Chainlink price feeds, custody providers such as BitGo and Fireblocks, and apps such as Uniswap for trading, Morpho for lending, and the Paxos-issued stablecoin <b>USDG</b>.</p>
<p>Robinhood's Stock Tokens are ERC-20 tokens. A Stock Token gives you price exposure to a share. It is not the same as owning the share itself, and it does not come with voting rights. Availability depends on where you live, and Robinhood has said the product reaches customers in more than 120 countries. Eligibility rules are different from country to country, and some regions are excluded, so read the official terms before you do anything.</p>

<h3>The honest limits</h3>
<p>At launch, a single sequencer, run by or for Robinhood, orders the transactions. That is normal for a young L2, but it means the chain is more centralized than the word "permissionless" might suggest. The chain is built for tokenized finance, so many of its biggest assets are issued by one company, and holding them means trusting that issuer. Adoption numbers in the first days of any new chain should be treated with caution, since they change fast and are measured in different ways.</p>

<h3>Arbitrum vs. Base vs. Robinhood Chain</h3>
<p>All three are Ethereum L2s that pay gas in ETH. Arbitrum One is a general DeFi hub with a community DAO. Base is tied to Coinbase and consumer apps. Robinhood Chain is a company-run chain focused on tokenized stocks and real-world assets. The first two are places many apps share. The third is more like a branded financial district.</p>
`,

title:"BNB Chain and Avalanche",
sub:"Two independent EVM Layer 1s: how they get speed and low fees, and what you give up.",
lesson:`
<h3>These two are different from the L2s</h3>
<p>In Sections 5 and 6, every network was an Ethereum layer 2. Now we turn to two networks that are <b>independent layer 1s</b>. Each has its own validators, its own coin and its own security. They are EVM-compatible, so your 0x address and your wallet work on them. But they do not settle back to Ethereum. If something goes wrong there, Ethereum cannot rescue it.</p>

<h3>BNB Chain</h3>
<p><b>BNB Chain</b> is a blockchain created by Binance, one of the largest crypto exchanges. Its main smart contract network is called <b>BNB Smart Chain</b>, or <b>BSC</b>, which launched in 2020. The coin is <b>BNB</b>, which pays the gas. Its chain ID is 56.</p>
<p>BSC is known for being fast and cheap. It uses a design called <b>proof of staked authority</b>. A small, limited set of validators take turns producing blocks, and they stake BNB. Fewer validators means quicker agreement, but it also means the network is more centralized than Ethereum, which has a very large number of validators. People who value speed and low fees often accept that trade. People who value maximum decentralization often do not.</p>
<p>BSC has kept getting faster. In January 2026 it activated an upgrade called <b>Fermi</b> on January 14, which cut the block time from 0.75 seconds to 0.45 seconds and aimed for transaction finality of about one second. BNB Chain also operates other pieces, such as an L2 called opBNB, but BSC is where most people start.</p>
<p>BSC has a huge number of users, a large DeFi scene, and a very active token scene, including many low-quality or scam tokens. PancakeSwap is a well-known exchange there. The same rule applies as always: check every token's contract address and be careful with anything that promises quick profits.</p>

<h3>Avalanche</h3>
<p><b>Avalanche</b> is a network built by a company called Ava Labs. It launched in 2020. The coin is <b>AVAX</b>, which pays gas on its main EVM chain. Avalanche is really a network of networks. Its three original built-in chains each had a job. The <b>X-Chain</b> was for creating and moving assets. The <b>P-Chain</b> coordinates validators and the network's custom chains. The <b>C-Chain</b> is the one that runs smart contracts and is EVM-compatible. When people say "Avalanche DeFi," they usually mean the C-Chain, whose chain ID is 43114.</p>
<p>Avalanche is known for fast finality, often about a second or two, through a consensus method where validators repeatedly sample each other until the network agrees. It has many validators, and it requires them to stake AVAX.</p>

<h3>Avalanche9000 and custom chains</h3>
<p>In December 2024, Avalanche shipped a large upgrade called <b>Avalanche9000</b>, also known as the Etna upgrade. It had two headline changes. One proposal, <b>ACP-77</b>, made it much cheaper to launch your own chain, now called an <b>Avalanche L1</b>. Before, someone starting a custom chain, then called a subnet, needed validators who each locked up a large stake. Now validators pay a small ongoing fee instead. The other, <b>ACP-125</b>, lowered the minimum fee on the C-Chain, from 25 nAVAX to 1 nAVAX, a reduction of 96 percent. The team said launching an L1 became about 99.9 percent cheaper.</p>
<p>The idea is that businesses, games and institutions can run their own tailored Avalanche L1s, with their own rules and fee tokens, and still talk to other Avalanche chains through built-in messaging. This is similar in spirit to Arbitrum Orbit chains, but there is a key difference: an Avalanche L1 has its own validators and does not inherit Ethereum's security, while an Orbit L2 settles to Ethereum.</p>

<h3>Comparing the two</h3>
<p>BNB Chain leans on Binance's reach and a small set of validators for speed and low fees. Avalanche leans on a larger validator set, quick finality, and the ability to spin up many custom chains. Both pay gas in their own coin, not ETH. That means you need BNB for BSC and AVAX for Avalanche's C-Chain, or your transactions will not go through.</p>

<h3>A balanced view</h3>
<p>Supporters of independent L1s say they can tune everything for speed and cost, without waiting on Ethereum's pace. Critics say you must trust a smaller group of validators or a single company's influence, and that liquidity is spread over many places. Neither side is simply right. Your job as a learner is to know what each network is built for, and where the trade-offs are.</p>

n:8,
title:"Using Many Networks: Wallets, Gas Tokens and Bridges",
sub:"One address, many networks. Adding networks, matching gas tokens, bridging carefully and choosing the right chain for the job.",
lesson:`
<h3>One address, many networks</h3>
<p>This is the single most useful fact of the EVM world. Your wallet produces one address that starts with 0x, and that same address works on Ethereum, Base, Arbitrum, Optimism, BNB Chain, Avalanche's C-Chain and Robinhood Chain. Your private keys are the same too. But the balances are separate. You can hold 5 ETH on Ethereum and zero on Base, with the same address.</p>
<p>Think of your address as a mailbox number that exists in seven different cities. What is in the box depends on which city you are in. Your wallet's network selector is the way you choose the city.</p>

<h3>Adding a network</h3>
<p>Many wallets already list the popular networks. When one is missing, you add it with four pieces of information: the <b>network name</b>, the <b>chain ID</b>, the <b>RPC address</b> (the doorway your wallet uses to talk to the network), and the <b>currency symbol</b>. A block explorer link is optional. Get these only from the network's official documentation, never from a random link or message. A fake RPC can show you false balances.</p>
<p>Here are the chain IDs you have met: Ethereum is 1. OP Mainnet is 10. BNB Smart Chain is 56. Robinhood Chain is 4663. Base is 8453. Arbitrum One is 42161. The Avalanche C-Chain is 43114. If your wallet shows a different ID for a network you think you are on, stop and check.</p>

<h3>The gas token rule</h3>
<p>Every transaction needs the network's gas token in your wallet on that network. Here is the list:</p>
<p>Ethereum, Base, Arbitrum One, OP Mainnet and Robinhood Chain all use <b>ETH</b> for gas. BNB Smart Chain uses <b>BNB</b>. The Avalanche C-Chain uses <b>AVAX</b>. A very common beginner problem is sending tokens to yourself on a new network and finding you cannot move them, because there is no gas token to pay with. Always bring a small amount of the gas token first.</p>

<h3>The same token, many versions</h3>
<p>USDC exists on many of these networks, but each one is a separate token with its own contract address. Some are issued directly by the stablecoin company on that network, called <b>native</b>. Others are <b>bridged</b> versions, which are claims created by a bridge. A bridged version can carry extra risk, and the same name can hide two different tokens, like "USDC" and "USDC.e." Check which one an app expects, and do not mix them up.</p>

<h3>How bridging works, step by step</h3>
<p>A bridge locks or burns an asset on one network and releases or creates a matching asset on another. Using a bridge safely goes like this:</p>
<p>First, use the official bridge for the network when you can. Many have one listed on their own website. Second, double-check the destination network and the address, since a mistake can lose funds. Third, send a small test amount first and wait until it arrives. Fourth, remember that moving from an L2 to Ethereum using an official optimistic rollup bridge can take about a week, while moving into an L2 is much faster. Fifth, expect fees on both sides.</p>
<p>Third-party bridges and aggregators can be faster and cheaper, because they front the funds and collect a fee, but they add trust in another company's code. Some of the largest hacks in crypto history were bridge hacks. Keep amounts small until you trust a route.</p>

<h3>Block explorers: your receipts</h3>
<p>Each network has a block explorer, a website where you can look up any address, transaction or token. Etherscan is the best-known, and similar explorers exist for other networks, such as BaseScan, Arbiscan, OP Mainnet's explorer, BscScan and Avalanche's explorers. Robinhood Chain launched with a Blockscout explorer. Use explorers to confirm a transaction, check a token's contract address and see an address's approvals.</p>

<h3>Choosing a network for the job</h3>
<p>There is no best network, only a best fit. Ethereum itself suits large, long-term value and the deepest set of apps. Base suits consumer apps and Coinbase-connected activity. Arbitrum One suits DeFi. OP Mainnet suits the Superchain ecosystem. Robinhood Chain suits tokenized stocks and real-world assets. BNB Chain suits low-cost, high-activity trading. Avalanche suits custom chains and fast finality. Whatever you pick, check the fee token, the liquidity for the asset you need, the exit path, and who runs the network.</p>

<h3>Test networks</h3>
<p>Every major network has a <b>testnet</b>, where tokens are free and have no value. Practice there first. Learn how to switch networks, send, swap and approve with fake money before you use real money.</p>
`,

n:9,
title:"Safety, Scams and Smart Risk Management",
sub:"Approvals, fake tokens, address poisoning, bridge and chain risk, and a simple routine that keeps you safer.",
lesson:`
<h3>The rule of the road</h3>
<p>On these networks, a transaction you sign is final. No bank can reverse it. No help desk can pull it back. This gives you freedom, and it also puts the responsibility on you. Safety is not a one-time setting. It is a set of habits.</p>

<h3>Protect your keys</h3>
<p>Your recovery phrase, usually 12 or 24 ordinary words, controls everything. Anyone who has it controls your wallet on every network in this course at once. Never type it into a website, a form, a chat or a "support" window. Never share it with anyone who contacts you. Real support teams never ask for it. Write it on paper, store it safely, and keep a backup in a separate place. For larger amounts, a hardware wallet keeps your keys offline and signs inside the device. Keep a small amount in a convenient wallet for daily use and the rest in more careful storage.</p>

<h3>Approvals: the quiet danger</h3>
<p>In Section 3 you learned that an approval lets a contract spend a token from your wallet. This is the doorway used by many wallet drainers. A fake site asks you to connect your wallet and sign something that looks harmless. In reality, you are approving a malicious contract to take your tokens. Some signatures do not even look like a transaction. They are messages that give permission for later.</p>
<p>To stay safe, read what you are signing. Be suspicious of any request to approve a token you did not expect, or to sign something with words you do not understand. Use a separate wallet for trying new apps, and keep little in it. Review your approvals from time to time with a tool or your block explorer, and revoke the ones you do not need. Revoking costs a small gas fee, and it is worth it.</p>

<h3>Common scams</h3>
<p><b>Fake tokens and airdrops.</b> A token you never asked for shows up in your wallet, with a website that tells you to claim something. Do not touch it. <b>Address poisoning.</b> A scammer sends you a tiny transaction from an address that looks nearly the same as one you use, hoping you copy it from your history later. Always check the full address, not just the first and last few letters. <b>Phishing sites.</b> A copy of a real site with a slightly different web address. Use bookmarks. <b>Fake support.</b> A private message offering help. <b>Giveaways.</b> "Send 1 ETH and get 2 back." This never happens. <b>Rug pulls.</b> A project builds hype, takes money, and then the creators drain the pool or sell their holdings. Cheap networks make launching tokens easy, so these are common on every network in this course. <b>Fake bridges and fake networks.</b> A bridge link or RPC address from a stranger.</p>
<p>A simple rule: if it is urgent, secret, or too good to be true, stop.</p>

<h3>Network and smart contract risk</h3>
<p>Even honest projects carry risks. A smart contract can have a bug, even after an audit. An audit is a review, not a guarantee. A bridge can be hacked. A stablecoin can lose its peg. An L2's sequencer can go offline, and while rollups have escape routes, they may be slow. An independent L1 such as BNB Chain or Avalanche depends on its own validators with no Ethereum safety net. A company-run chain such as Robinhood Chain depends on one company's choices. A Stock Token depends on its issuer. None of these risks mean you should never use the network, but they mean you should size your exposure with care and never put in more than you can afford to lose.</p>

<h3>Rules and taxes</h3>
<p>Rules about crypto vary by country and change over time. In the United States, the tax authorities generally treat crypto as property, and swaps, sales and some earnings can be taxable events. Keep records of what you do on each network, since you will have activity in several places. Check current rules where you live, and speak to a qualified tax professional. This course is education, not financial or tax advice.</p>

<h3>A simple routine</h3>
<p>Before every new action, ask five questions. Am I on the right network? Is the address or contract the official one? What exactly am I approving or signing? Can I afford to lose this amount? What is my way out if something goes wrong? Start small, use testnets to practice, and keep learning.</p>

<h3>Where to go next</h3>
<p>You now know how Ethereum works, why so many EVM networks exist, how Base, Optimism, Arbitrum, Robinhood Chain, BNB Chain and Avalanche differ, and how to move between them with care. Try the bonus gas calculator, practice on a testnet, and then take the final exam.</p>
`,

<script>

var TTS={ok:("speechSynthesis" in window),voices:[],voice:null,rate:0.95,units:[],idx:0,state:"stop",token:0,armed:false,done:false};
var PRON=[[/\bEVM\b/g,"E V M"],[/\bETH\b/g,"ether"],[/\bWETH\b/g,"wrapped ether"],[/\bL1s\b/g,"L 1s"],[/\bL2s\b/g,"L 2s"],[/\bL1\b/g,"L 1"],[/\bL2\b/g,"L 2"],[/\bEOA\b/g,"E O A"],[/\bERC-(\d+)/g,"E R C $1"],[/\bEIP-(\d+)/g,"E I P $1"],[/\bACP-(\d+)/g,"A C P $1"],[/\bDeFi\b/g,"dee fi"],[/\bDEX\b/g,"decks"],[/\bAMM\b/g,"A M M"],[/\bNFTs\b/g,"N F Ts"],[/\bNFT\b/g,"N F T"],[/\bDAO\b/g,"dow"],[/\bZK\b/g,"Z K"],[/\bBSC\b/g,"B S C"],[/\bBNB\b/g,"B N B"],[/\bAVAX\b/g,"ay vax"],[/\bARB\b/g,"arb"],[/\bOP\b/g,"O P"],[/\bUSDC\b/g,"U S D C"],[/\bUSDT\b/g,"U S D T"],[/\bUSDG\b/g,"U S D G"],[/\bRPC\b/g,"R P C"],[/\bSEC\b/g,"S E C"],[/\bgwei\b/g,"gway"],[/\b0x\b/g,"zero x"],[/\bnAVAX\b/g,"nano ay vax"],[/\bBoLD\b/g,"bold"],[/\bStylus\b/g,"sty-luss"],[/\bFusaka\b/g,"foo-sah-kah"],[/\bGlamsterdam\b/g,"glam-ster-dam"],[/\bPectra\b/g,"peck-truh"],[/\bDencun\b/g,"den-coon"],[/\bAxelar\b/g,"ax-eh-lar"],[/\bL2BEAT\b/g,"L 2 beat"],[/\bBTC\b/g,"bitcoin"],[/\bIRS\b/g,"I R S"]];
function loadVoices(){
  if(!TTS.ok)return;
  var all=speechSynthesis.getVoices()||[];

  var pick=null;

  if(!pick){
    var order=[/Aria|Jenny|Michelle|Emma|Ana\b|Sonia|Libby/i,/Zira|Samantha|Karen|Moira|Tessa|Serena|Google US English|Female/i];
    for(var i=0;i<order.length&&!pick;i++){pick=TTS.voices.find(function(v){return order[i].test(v.name)})}
  }
  TTS.voice=pick||TTS.voices[0]||null;
  var sel=$("#voiceSel");
  if(sel){sel.innerHTML=TTS.voices.map(function(v){return '<option value="'+esc(v.name)+'"'+(TTS.voice&&v.name===TTS.voice.name?" selected":"")+'>'+esc(v.name)+'</option>'}).join("")}
}
if(TTS.ok){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function chunks(t){
  var out=[],parts=t.match(/[^.!?]+[.!?]+["”')\]]*\s*|[^.!?]+$/g)||[t];var cur="";
  parts.forEach(function(p){if((cur+p).length>170&&cur){out.push(cur);cur=p}else cur+=p});
  if(cur.trim())out.push(cur);return out;
}
function say(i){
  if(!TTS.ok)return;
  speechSynthesis.cancel();TTS.token++;var my=TTS.token;TTS.idx=i;TTS.state="play";TTS.armed=true;ui();
  speakUnit(my);
}
function speakUnit(my){
  if(my!==TTS.token)return;
  if(TTS.idx>=TTS.units.length){TTS.state="stop";TTS.idx=0;TTS.done=true;mark(null);ui();var s=SECTIONS[cur-1];if(s)checkGate(true);return}
  var el=TTS.units[TTS.idx];mark(el);
  var text=el.innerText.replace(/\s+/g," ");PRON.forEach(function(r){text=text.replace(r[0],r[1])});
  var parts=chunks(text),k=0;
  (function next(){
    if(my!==TTS.token)return;
    if(k>=parts.length){TTS.idx++;speakUnit(my);return}
    var u=new SpeechSynthesisUtterance(parts[k++]);
    if(TTS.voice)u.voice=TTS.voice;u.rate=TTS.rate;u.pitch=1.08;u.lang=(TTS.voice&&TTS.voice.lang)||"en-US";
    u.onend=next;u.onerror=function(e){if(my===TTS.token&&e.error!=="interrupted"&&e.error!=="canceled")next()};
    speechSynthesis.speak(u);
  })();
}
function mark(el){var o=document.querySelector(".speaking");if(o)o.classList.remove("speaking");if(el){el.classList.add("speaking");el.scrollIntoView({block:"center",behavior:"smooth"})}}
function stopSay(){if(!TTS.ok)return;TTS.token++;speechSynthesis.cancel();TTS.state="stop";TTS.idx=0;mark(null);ui()}
function pauseSay(){if(!TTS.ok)return;TTS.token++;speechSynthesis.cancel();TTS.state="pause";ui()}
function ui(){
  var p=$("#aPlay");if(!p)return;

}

/* ============ VIEWS ============ */
var cur=0;

  go("welcome");
  var h='<div class="hero"><div class="eyebrow">Block Wall Street presents</div><h1>Ethereum &amp; <span>EVM Networks</span></h1><p class="small" style="font-size:19px;color:var(--text)">From the first smart contract to Base, Arbitrum, Optimism, BNB Chain, Avalanche and Robinhood Chain. 9 sections, a quiz after each one, a 44-question final exam and a certificate of completion.</p></div>';
  h+='<div class="card"><h2>What you will get</h2><ul><li>Plan on about 2 hours at a normal pace, with lessons written in plain words that an 8th grader can follow.</li><li>A <b>Listen</b> button in every lesson that reads it out loud to you.</li><li>How Ethereum works, why so many EVM networks exist, how six of them differ, and how to stay safe moving between them.</li><li>Quizzes you cannot beat by skimming. You have to <b>read</b> or <b>listen</b> first. The lesson is hidden while you take the quiz.</li><li>You need <b>'+PASS+'%</b> on each quiz to move on.</li><li>Your grades and certificate are sent to Block Wall Street.</li><li>A bonus <b>Gas Fee Calculator</b> with an easy walk-through at the end.</li></ul></div>';
  if(S.started){
    h+='<div class="card"><h2>Welcome back, '+esc(S.name.split(" ")[0])+'</h2><p>Your progress is saved on this device.</p><button class="primary" onclick="showHome()">Continue the course</button> <button class="ghost" onclick="resetAll()">Start over as someone else</button></div>';
  }else{
    h+='<div class="card"><h2>Start here</h2><label for="nm">Your full name (this is exactly how it will print on your certificate)</label><input type="text" id="nm" autocomplete="name" placeholder="First and last name"><label for="em">Your email (optional, so we can reach you)</label><input type="email" id="em" autocomplete="email" placeholder="you@example.com"><p class="small">Check your spelling. You can fix it once more on the last screen before your certificate is made.</p><div id="nerr" class="small" style="color:var(--bad)"></div><button class="primary" onclick="begin()">Begin the course</button></div>';

function showHome(){

  var h='<div class="hero" style="padding-top:6px"><div class="eyebrow">Course map</div><h1 style="font-size:clamp(36px,7vw,60px)">Hello, <span>'+esc(S.name.split(" ")[0])+'</span></h1></div>';

  SECTIONS.forEach(function(s){
    var d=sec(s.n),ok=unlocked(s.n);
    var tag=d.passed?'<span class="tag ok">'+d.best+'% · passed</span>':(ok?'<span class="tag">'+(d.attempts?'best '+d.best+'%':'ready')+'</span>':'<span class="tag lock">🔒 locked</span>');
    h+='<div class="sec" '+(ok?'style="cursor:pointer" onclick="openSection('+s.n+')"':'')+'><div class="num">'+s.n+'</div><div class="meta"><b>'+esc(s.title)+'</b><span>'+esc(s.sub)+'</span><br><span>≈ '+Math.round(words(s.lesson)/150+s.q.length*0.3)+' min · '+s.q.length+'-question quiz</span></div>'+tag+'</div>';
  });

  h+='<div class="sec" '+(fin?'style="cursor:pointer;border-color:var(--gold)" onclick="startQuiz(\'final\')"':'')+'><div class="num">★</div><div class="meta"><b>Final Exam</b><span>44 questions covering the whole course. '+PASS+'% to pass.</span></div>'+(S.final.passed?'<span class="tag ok">'+S.final.best+'% · passed</span>':(fin?'<span class="tag">ready</span>':'<span class="tag lock">🔒 pass all 9 first</span>'))+'</div>';
  var bon=passedCount()===SECTIONS.length;

  h+='</div>';

}
function buildDrawer(){

  SECTIONS.forEach(function(s){var ok=unlocked(s.n),x=sec(s.n);h+='<div class="sec" '+(ok?'onclick="openSection('+s.n+')"':'style="opacity:.5"')+'><div class="num">'+s.n+'</div><div class="meta"><b>'+esc(s.title)+'</b></div><span class="tag '+(x.passed?'ok':'')+'">'+(x.passed?x.best+'%':ok?'open':'🔒')+'</span></div>'});
  h+='<div class="sec" '+(passedCount()===SECTIONS.length?'onclick="startQuiz(\'final\')"':'style="opacity:.5"')+'><div class="num">★</div><div class="meta"><b>Final Exam</b></div></div>';
  h+='<div class="sec" '+(passedCount()===SECTIONS.length?'onclick="showBonus()"':'style="opacity:.5"')+'><div class="num">$</div><div class="meta"><b>Bonus: Gas Fee Calculator</b></div></div>';
  d.innerHTML=h;
}
function openMenu(){buildDrawer();$("#drawer").classList.add("open");$("#veil").classList.add("open")}
function closeMenu(){$("#drawer").classList.remove("open");$("#veil").classList.remove("open")}
$("#menuBtn").onclick=function(){if(S.started)openMenu()};$("#veil").onclick=closeMenu;


function audioHTML(){
  var h='<div class="audio" id="audioBar">';
  if(TTS.ok){h+='<button class="primary" id="aPlay">▶ Listen</button><button id="aPrev" title="Previous paragraph">⏮</button><button id="aNext" title="Next paragraph">⏭</button><button id="aStop">⏹</button><span class="lab">SPEED</span><select id="rate"><option value="0.8">Slow</option><option value="0.95" selected>Normal</option><option value="1.1">Fast</option><option value="1.3">Faster</option></select><span class="lab">VOICE</span><select id="voiceSel"></select>'}
  else{h+='<span class="small">Your browser cannot read aloud. Try Microsoft Edge or Google Chrome.</span>'}
  return h+'</div>';
}
function wireAudio(){
  TTS.units=Array.prototype.slice.call(document.querySelectorAll("#lessonBody h3,#lessonBody p,#lessonBody li"));
  if(TTS.ok){
    loadVoices();
    $("#aPlay").onclick=function(){if(TTS.state==="play")pauseSay();else say(TTS.idx)};
    $("#aPrev").onclick=function(){say(Math.max(0,TTS.idx-1))};
    $("#aNext").onclick=function(){say(Math.min(TTS.units.length-1,TTS.idx+1))};
    $("#aStop").onclick=stopSay;
    $("#rate").onchange=function(){TTS.rate=parseFloat(this.value);if(TTS.state==="play")say(TTS.idx)};
    $("#voiceSel").onchange=function(){var nm=this.value;TTS.voice=TTS.voices.find(function(v){return v.name===nm});try{localStorage.setItem("bws_voice",nm)}catch(e){}if(TTS.state==="play")say(TTS.idx)};
    $("#lessonBody").onclick=function(e){if(!TTS.armed)return;var el=e.target.closest("h3,p,li");var i=TTS.units.indexOf(el);if(i>=0)say(i)};
  }
}
/* ----- lesson ----- */
var bottomSeen=false,io=null;
function openSection(n){
  if(!unlocked(n))return;

  var s=SECTIONS[n-1],d=sec(n);
  var h='<div class="lessonhead"><div class="eyebrow">Section '+n+' of '+SECTIONS.length+'</div><h1>'+esc(s.title)+'</h1><div class="small">'+esc(s.sub)+'</div></div>';

  h+='<div id="sentinel"></div><div class="gate"><div class="msg" id="gateMsg"></div><button class="primary" id="qBtn" disabled onclick="startQuiz('+n+')">Take the Section '+n+' quiz ('+s.q.length+' questions)</button><p class="small">The lesson is hidden during the quiz, so read or listen carefully first.</p></div>';

  if(io)io.disconnect();

  checkGate();
}
function need(n){var d=sec(n);var m=minSecs(n);if(d.reread)m=Math.round(m/2);return SKIP?0:m}
function checkGate(audioDone){
  if(view!=="lesson")return;
  var n=cur,d=sec(n),m=need(n),left=Math.max(0,m-d.time);

  var b=$("#qBtn"),g=$("#gateMsg");if(!b)return;
  b.disabled=!ok;
  g.textContent=ok?"You are ready. Good luck!":(left>0?"Quiz unlocks after about "+Math.floor(left/60)+":"+("0"+(left%60)).slice(-2)+" of reading time"+(bottomSeen?"":" and when you reach the end of the lesson")+".":"Scroll to the end of the lesson (or let the audio finish) to unlock the quiz.");
  if(ok&&!d.read){d.read=true;save()}
}
setInterval(function(){
  if(document.hidden||!S.started)return;
  if(view==="lesson"){var d=sec(cur);d.time++;S.seconds++;if(d.time%10===0)save();checkGate()}
  else if(view==="quiz"){S.seconds++}
},1000);
window.addEventListener("beforeunload",save);

/* ----- quiz ----- */
var Qz=null;
function buildItems(src){
  return shuffle(src).map(function(r){
    var opts=shuffle([0,1,2,3]).map(function(k){return {t:r[1+k],ok:k===0}});
    return {q:r[0],opts:opts,why:r[5],pick:-1};
  });
}
function startQuiz(which){
  stopSay();
  if(which==="final"){Qz={kind:"final",n:0,title:"Final Exam",items:buildItems(FINAL),i:0}}
  else{var s=SECTIONS[which-1];cur=which;Qz={kind:"sec",n:which,title:"Section "+which+" Quiz",items:buildItems(s.q),i:0}}
  go("quiz");renderQ();
}
function renderQ(){
  var it=Qz.items[Qz.i],N=Qz.items.length,answered=Qz.items.filter(function(x){return x.pick>=0}).length;
  var h='<div class="card"><div class="qhead"><span>'+esc(Qz.title)+'</span><span>Question '+(Qz.i+1)+' of '+N+'</span></div><div class="qbar"><i style="width:'+Math.round(answered/N*100)+'%"></i></div>';
  h+='<div class="qtext">'+esc(it.q)+'</div>';
  it.opts.forEach(function(o,k){h+='<button class="opt'+(it.pick===k?' sel':'')+'" onclick="pick('+k+')">'+String.fromCharCode(65+k)+'. '+esc(o.t)+'</button>'});
  h+='<div class="nav"><button class="ghost" onclick="stepQ(-1)" '+(Qz.i===0?'disabled':'')+'>← Back</button>';
  if(Qz.i<N-1)h+='<button class="primary" onclick="stepQ(1)">Next →</button>';
  else h+='<button class="primary" onclick="finishQ()">Submit answers</button>';
  h+='</div><div class="dots">';
  Qz.items.forEach(function(x,k){h+='<i class="'+(x.pick>=0?'done ':'')+(k===Qz.i?'cur':'')+'" onclick="jumpQ('+k+')">'+(k+1)+'</i>'});
  h+='</div><div class="small">'+answered+' of '+N+' answered. You can change an answer until you submit.</div>';
  if(Qz.kind==="sec")h+='<div style="margin-top:12px"><button class="ghost" onclick="leaveQuiz()">Leave quiz and go back to the lesson</button></div>';
  h+='</div>';app.innerHTML=h;
}
function pick(k){Qz.items[Qz.i].pick=k;renderQ()}
function stepQ(d){Qz.i=Math.max(0,Math.min(Qz.items.length-1,Qz.i+d));renderQ();window.scrollTo(0,0)}
function jumpQ(k){Qz.i=k;renderQ();window.scrollTo(0,0)}
function leaveQuiz(){if(confirm("Leave this quiz? Your answers will not be saved.")){openSection(Qz.n)}}
function finishQ(){
  var un=Qz.items.filter(function(x){return x.pick<0}).length;
  if(un&&!confirm(un+" question"+(un>1?"s are":" is")+" unanswered and will count as wrong. Submit anyway?"))return;
  var N=Qz.items.length,c=0;Qz.items.forEach(function(x){if(x.pick>=0&&x.opts[x.pick].ok)c++});
  var pct=Math.round(c/N*100),pass=pct>=PASS;
  var d=Qz.kind==="final"?S.final:sec(Qz.n);
  if(d.first===null||d.first===undefined)d.first=pct;
  d.attempts++;if(pct>d.best)d.best=pct;
  if(pass)d.passed=true;
  if(!pass&&Qz.kind==="sec"){d.read=false;d.reread=true;d.time=0}
  save();progress();showResult(c,N,pct,pass);
}
function showResult(c,N,pct,pass){
  go("result");
  var isFinal=Qz.kind==="final";
  var h='<div class="card score '+(pass?'':'fail')+'"><div class="eyebrow">'+esc(Qz.title)+' result</div><div class="big">'+pct+'%</div><p><b>'+c+' of '+N+' correct</b> · '+(pass?'You passed!':'You need '+PASS+'% to pass.')+'</p>';
  if(pass){
    if(isFinal)h+='<button class="primary" onclick="showCert()">Continue to my certificate →</button>';
    else if(Qz.n<SECTIONS.length)h+='<button class="primary" onclick="openSection('+(Qz.n+1)+')">Go to Section '+(Qz.n+1)+' →</button>';

    else h+='<p>Go back and read or listen to the lesson again, then retake the quiz. The questions and answers will be shuffled.</p><button class="primary" onclick="openSection('+Qz.n+')">Review the lesson</button>';
  }
  h+='</div><div class="card"><h2>Review</h2>';
  Qz.items.forEach(function(x,k){

/* ----- certificate + report ----- */
function certId(){
  if(S.cert)return S.cert.id;
  var base=S.name.toUpperCase()+"|"+new Date(S.done||Date.now()).toISOString().slice(0,10)+"|"+overall();
  var h=5381;for(var i=0;i<base.length;i++){h=((h<<5)+h+base.charCodeAt(i))>>>0}
  var dt=new Date(S.done||Date.now()),p=function(n){return ("0"+n).slice(-2)};
  return "BWS-ETH-"+dt.getFullYear()+p(dt.getMonth()+1)+p(dt.getDate())+"-"+h.toString(16).toUpperCase().slice(0,6);
}
function showCert(){
  go("cert");
  if(!S.done){S.done=Date.now();save()}
  var sent=S.sent;
  var h='<div class="hero" style="padding-top:0"><div class="eyebrow">Congratulations</div><h1 style="font-size:clamp(38px,7vw,64px)">You <span>did it</span>, '+esc(S.name.split(" ")[0])+'</h1></div>';
  h+='<div class="card"><h2>Your results</h2><p><b>Overall course grade: '+overall()+'% ('+letter(overall())+')</b><br><span class="small">Section quizzes average '+sectionAvg()+'% (counts 50%). Final exam '+S.final.best+'% (counts 50%).</span></p></div>';
  if(!sent){
    h+='<div class="card"><h2>Check your name</h2><p>This is exactly what will be printed on your certificate and sent to Block Wall Street with your grades.</p><input type="text" id="cn" value="'+esc(S.name)+'"><div class="small" id="cerr" style="color:var(--bad)"></div><br><button class="primary" id="sendBtn" onclick="finish()">Looks right. Make my certificate and send my report</button></div>';
  }else{
    h+=certBlock();
  }
  app.innerHTML=h;
  if(sent){drawCert();if(!S.reportSent&&view==='cert'&&!window._sending){var st=$('#sendStatus');if(st&&!st.innerHTML)st.innerHTML='<div class="status warn">Your report has not been confirmed as sent. <button onclick="retrySend()">Send it now</button></div>'}}
}
function certBlock(){
  return '<div id="sendStatus"></div><div class="card"><canvas id="cert" width="1600" height="1130"></canvas><div class="nav" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary" onclick="dlCert()">⬇ Download certificate (PNG)</button><button onclick="printCert()">🖨 Print / save as PDF</button><button onclick="showBonus()">Calculator</button><button class="ghost" onclick="showHome()">Course map</button></div></div>';
}
function finish(){
  var n=$("#cn").value.trim().replace(/\s+/g," ");
  if(n.length<3||n.indexOf(" ")<0){$("#cerr").textContent="Please enter your first and last name.";return}
  S.name=n;S.cert=null;S.cert={id:certId()};S.sent=true;S.reportSent=false;save();
  showCert();
  $("#sendStatus").innerHTML='<div class="status warn">Sending your report to Block Wall Street…</div>';
  drawCert().then(function(){return sendReport()});
}
function report(){
  var L=[];
  L.push("BLOCK WALL STREET — ETHEREUM & EVM NETWORKS — COMPLETION REPORT");
  L.push("");
  L.push("Student name: "+S.name);
  L.push("Student email: "+(S.email||"(not given)"));

  L.push("Active time in course: "+fmtDur(S.seconds));

  L.push("");

  L.push("  = 50% section quiz average ("+sectionAvg()+"%) + 50% final exam ("+S.final.best+"%)");
  L.push("");
  L.push("SECTION QUIZ GRADES (best score | first attempt | attempts)");

  L.push("");
  L.push("FINAL EXAM (44 questions): "+S.final.best+"%  |  first "+S.final.first+"%  |  "+S.final.attempts+" attempt"+(S.final.attempts===1?"":"s"));
  L.push("");
  L.push("CERTIFICATE TEXT");
  L.push("  CERTIFICATE OF COMPLETION");

  L.push("  has successfully completed ETHEREUM & EVM NETWORKS");

  L.push("  Date: "+fmtDate(S.done)+" · ID: "+S.cert.id);
  L.push("  Block Wall Street · "+PARTNER);
  return L.join("\n");
}
function sendReport(){
  var subject="Ethereum & EVM Networks completed: "+S.name+" — "+overall()+"% ("+letter(overall())+") — "+S.cert.id;
  function post(withFile,blob){
    var fd=new FormData();
    fd.append("access_key",W3F_KEY);fd.append("subject",subject);fd.append("from_name","BWS Bitcoin Course");
    fd.append("student_name",S.name);if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email))fd.append("email",S.email);
    fd.append("overall_grade",overall()+"%");fd.append("certificate_id",S.cert.id);fd.append("message",report());
    if(withFile&&blob)fd.append("attachment",blob,"Certificate-"+S.name.replace(/[^A-Za-z0-9]+/g,"_")+".png");
    return fetch("https://api.web3forms.com/submit",{method:"POST",body:fd}).then(function(r){return r.json()});
  }
  return new Promise(function(res){$("#cert").toBlob(res,"image/png")}).then(function(blob){
    return post(true,blob).then(function(j){if(j&&j.success)return j;return post(false)}).catch(function(){return post(false)});
  }).then(function(j){
    var el=$("#sendStatus");
    if(j&&j.success){S.reportSent=true;save();el.innerHTML='<div class="status ok">✔ Your report and certificate details were sent to Block Wall Street.</div>'}
    else el.innerHTML='<div class="status warn">We could not send the report. Check your internet, then <button onclick="retrySend()">try again</button></div>';
  }).catch(function(){
    $("#sendStatus").innerHTML='<div class="status warn">We could not send the report. Check your internet, then <button onclick="retrySend()">try again</button></div>';
  });
}
function retrySend(){$("#sendStatus").innerHTML='<div class="status warn">Sending…</div>';sendReport()}

function drawCert(){
  var fontP=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load("120px 'Great Vibes'"),document.fonts.load("80px 'Bebas Neue'"),document.fonts.load("28px 'Barlow'")]).catch(function(){}):Promise.resolve();
  return fontP.then(function(){
    var c=$("#cert");if(!c)return;var x=c.getContext("2d"),W=c.width,H=c.height;
    var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#0a1628");g.addColorStop(1,"#143059");x.fillStyle=g;x.fillRect(0,0,W,H);
    x.strokeStyle="#f0b429";x.lineWidth=10;x.strokeRect(36,36,W-72,H-72);x.lineWidth=2;x.strokeRect(60,60,W-120,H-120);
    [[60,60],[W-60,60],[60,H-60],[W-60,H-60]].forEach(function(p){x.fillStyle="#f0b429";x.beginPath();x.arc(p[0],p[1],12,0,7);x.fill()});
    x.textAlign="center";x.fillStyle="#f0b429";
    x.font="64px 'Bebas Neue',Impact,sans-serif";x.fillText("B L O C K   W A L L   S T R E E T",W/2,170);
    x.fillStyle="#9fb2cf";x.font="26px 'DM Mono',monospace";x.fillText("EDUCATION  ·  COMMUNITY  ·  OWNERSHIP",W/2,212);
    x.fillStyle="#ffffff";fit(x,"CERTIFICATE OF COMPLETION",W-260,108,"'Bebas Neue',Impact,sans-serif");x.fillText("CERTIFICATE OF COMPLETION",W/2,345);
    x.fillStyle="#9fb2cf";x.font="32px 'Barlow',Arial,sans-serif";x.fillText("This certifies that",W/2,420);
    var name=S.name,fs=130;x.font=fs+"px 'Great Vibes','Brush Script MT',cursive";while(x.measureText(name).width>W-300&&fs>50){fs-=6;x.font=fs+"px 'Great Vibes','Brush Script MT',cursive"}
    x.fillStyle="#f0b429";x.fillText(name,W/2,555);
    x.strokeStyle="#f0b429";x.lineWidth=2;x.beginPath();x.moveTo(300,585);x.lineTo(W-300,585);x.stroke();
    x.fillStyle="#9fb2cf";x.font="32px 'Barlow',Arial,sans-serif";x.fillText("has successfully completed the course",W/2,650);
    x.fillStyle="#ffffff";fit(x,"ETHEREUM & EVM NETWORKS",W-300,96,"'Bebas Neue',Impact,sans-serif");x.fillText("ETHEREUM & EVM NETWORKS",W/2,750);
    x.fillStyle="#9fb2cf";x.font="28px 'Barlow',Arial,sans-serif";x.fillText("From Smart Contracts to Seven Networks  ·  9 Sections  ·  Final Exam",W/2,795);
    x.fillStyle="#e9eef7";x.font="34px 'Barlow',Arial,sans-serif";x.fillText("Overall Grade: "+overall()+"% ("+letter(overall())+")     ·     Final Exam: "+S.final.best+"%",W/2,860);
    x.fillStyle="#f0b429";x.font="30px 'Barlow',Arial,sans-serif";x.fillText(PARTNER,W/2,915);
    // signature + date
    x.strokeStyle="#9fb2cf";x.lineWidth=1.5;x.beginPath();x.moveTo(190,1005);x.lineTo(560,1005);x.moveTo(W-560,1005);x.lineTo(W-190,1005);x.stroke();
    x.fillStyle="#9fb2cf";x.font="24px 'Barlow',Arial,sans-serif";x.fillText("Founder, Block Wall Street",375,1040);x.fillText("Date: "+fmtDate(S.done),W-375,1040);
    x.font="22px 'DM Mono',monospace";x.fillText("Certificate ID: "+S.cert.id,W/2,1075);
    // seal
    var sx=W/2,sy=990;x.fillStyle="#f0b429";x.beginPath();x.arc(sx,sy,62,0,7);x.fill();x.fillStyle="#0a1628";x.beginPath();x.arc(sx,sy,52,0,7);x.fill();x.strokeStyle="#f0b429";x.lineWidth=2;x.beginPath();x.arc(sx,sy,44,0,7);x.stroke();
    x.fillStyle="#f0b429";fit(x,"BWS",70,44,"'Bebas Neue',Impact,sans-serif");x.fillText("BWS",sx,sy+8);fit(x,"VERIFIED",64,13,"'DM Mono',monospace");x.fillText("VERIFIED",sx,sy+30);
  });
}
function fit(x,text,maxW,size,fam){x.font=size+"px "+fam;while(x.measureText(text).width>maxW&&size>10){size-=2;x.font=size+"px "+fam}}
function dlCert(){var a=document.createElement("a");a.download="Certificate-"+S.name.replace(/[^A-Za-z0-9]+/g,"_")+".png";a.href=$("#cert").toDataURL("image/png");a.click()}
function printCert(){var w=window.open("","_blank");if(!w){alert("Please allow pop-ups to print.");return}w.document.write('<html><head><title>Certificate</title><style>@page{size:landscape;margin:0}body{margin:0}img{width:100%}</style></head><body><img src="'+$("#cert").toDataURL("image/png")+'"></body></html>');w.document.close();w.focus();setTimeout(function(){w.print()},400)}


/* ============ BONUS: GAS FEE CALCULATOR ============ */
var BONUS_TEXT='<div class="lessonhead"><div class="eyebrow">Bonus tool</div><h1>The Gas Fee Calculator</h1><div class="small">Turn gas units and gwei into dollars, and compare the networks side by side.</div></div>'+
'<article id="lessonBody">'+
'<h3>What is this tool?</h3>'+
'<p>This page is a what-if machine for network fees. It uses the math from Section 2: fee equals gas units times the gas price. It then shows what that fee costs in dollars on each network from this course. It does not know live prices. You type them in, so you can test different stories.</p>'+
'<h3>Step 1: pick an action</h3>'+
'<p>Choose what you want to do. A simple ETH transfer uses 21,000 gas. A token transfer and a swap use more. The numbers in the menu are rough examples, because real swaps vary a lot from one app to another. You can also type your own number.</p>'+
'<h3>Step 2: fill in the table</h3>'+
'<p>Each row is a network. In the gas price column, type the price in gwei. On the real networks this number changes all the time, so look at a gas tracker or your wallet for a live value. The starting numbers are only examples. In the price column, type the dollar price of that network’s gas token. ETH pays gas on Ethereum, Base, Arbitrum, Optimism and Robinhood Chain. BNB pays on BNB Smart Chain. AVAX pays on Avalanche’s C-Chain.</p>'+
'<h3>Step 3: do not forget the data fee</h3>'+
'<p>Section 4 taught you that an L2 fee has two parts: running your transaction, and your share of posting data to Ethereum. The L2 rows have a box for that second part, in dollars. Leave it small, or raise it to see how the total changes. The independent L1 rows do not have this part.</p>'+
'<h3>Step 4: read the result</h3>'+
'<p>The tool shows the fee in the native token and in dollars for every row, and marks the cheapest. Try changing the ETH price or the gwei on Ethereum and notice that the L2 rows barely move. That is the point of a layer 2. Treat the output as a learning aid, not a quote.</p>'+
'</article>';
var GCH=[
 ["Ethereum","ETH",1.5,3000,false,0],
 ["Base","ETH",0.01,3000,true,0.01],
 ["Arbitrum One","ETH",0.02,3000,true,0.01],
 ["OP Mainnet","ETH",0.01,3000,true,0.01],
 ["Robinhood Chain","ETH",0.02,3000,true,0.01],
 ["BNB Smart Chain","BNB",0.1,600,false,0],
 ["Avalanche C-Chain","AVAX",1,25,false,0]
];
function money(v){var a=Math.abs(v);return (v<0?"-":"")+"$"+(a>=100?Math.round(a).toLocaleString():a>=0.01?a.toFixed(2):a.toFixed(4))}
function showBonus(){
  go("bonus");TTS.armed=false;
  var h=BONUS_TEXT.replace('<article id="lessonBody">',audioHTML()+'<div class="small" id="hint">Tip: press Listen to hear the walk-through read aloud.</div><article id="lessonBody">');
  h+='<div class="card calc" id="calc"><h2>Gas fee comparison</h2>'+
  '<label for="g_act">1. What are you doing?</label><select id="g_act"><option value="21000">Send ETH or a native coin (21,000 gas)</option><option value="65000">Send a token (about 65,000 gas)</option><option value="150000" selected>Swap tokens (about 150,000 gas)</option><option value="300000">Add to a liquidity pool (about 300,000 gas)</option></select>'+
  '<label for="g_units">Or type your own gas units</label><input type="number" id="g_units" min="21000" step="1000" placeholder="leave empty to use the menu">'+
  '<div style="overflow-x:auto;margin-top:12px"><table style="width:100%;border-collapse:collapse;font-size:15px"><thead><tr style="text-align:left;color:var(--muted)"><th style="padding:6px">Network</th><th>Gas price (gwei)</th><th>Token price ($)</th><th>L1 data fee ($)</th><th>Fee</th></tr></thead><tbody id="g_rows"></tbody></table></div>'+
  '<div id="g_out"></div></div>'+
  '<div class="nav"><button class="primary" onclick="showHome()">Back to course map</button>'+(S.final.passed?'<button onclick="showCert()">My certificate</button>':'')+'</div>';
  app.innerHTML=h;wireAudio();
  var rows="";
  GCH.forEach(function(c,i){
    rows+='<tr style="border-top:1px solid var(--line)"><td style="padding:6px"><b>'+c[0]+'</b><br><span class="small">gas: '+c[1]+(c[4]?' · L2':' · L1')+'</span></td>'+
    '<td><input type="number" id="gw'+i+'" value="'+c[2]+'" min="0" step="0.01" style="width:100px"></td>'+
    '<td><input type="number" id="gp'+i+'" value="'+c[3]+'" min="0" step="1" style="width:90px"></td>'+
    '<td>'+(c[4]?'<input type="number" id="gd'+i+'" value="'+c[5]+'" min="0" step="0.01" style="width:80px">':'<span class="small">n/a</span>')+'</td>'+
    '<td id="gf'+i+'"></td></tr>';
  });
  $("#g_rows").innerHTML=rows;
  var ids=["g_act","g_units"];GCH.forEach(function(c,i){ids.push("gw"+i,"gp"+i);if(c[4])ids.push("gd"+i)});
  ids.forEach(function(id){var e=$("#"+id);e.oninput=gcalc;e.onchange=gcalc});
  gcalc();
}
function gcalc(){
  var out=$("#g_out");if(!out)return;
  var u=+$("#g_units").value||+$("#g_act").value||21000;u=Math.max(21000,u);
  var res=GCH.map(function(c,i){
    var gw=Math.max(0,+$("#gw"+i).value||0),px=Math.max(0,+$("#gp"+i).value||0),d=c[4]?Math.max(0,+$("#gd"+i).value||0):0;
    var native=u*gw/1e9,usd=native*px+d;return {n:c[0],sym:c[1],native:native,usd:usd};
  });
  var min=Math.min.apply(null,res.map(function(r){return r.usd}));
  res.forEach(function(r,i){
    var cell=$("#gf"+i);
    cell.innerHTML='<b style="color:'+(r.usd===min?'var(--good)':'#fff')+'">'+money(r.usd)+'</b><br><span class="small">'+r.native.toPrecision(3)+' '+r.sym+(r.usd===min?' · cheapest':'')+'</span>';
  });
  var eth=res[0],cheap=res.filter(function(r){return r.usd===min})[0];
  var ratio=cheap.usd>0?eth.usd/cheap.usd:0;
  out.innerHTML='<div class="callout"><p><b>In plain words:</b> This action uses '+u.toLocaleString()+' gas. At your numbers, it costs about '+money(eth.usd)+' on Ethereum and about '+money(cheap.usd)+' on '+cheap.n+', the cheapest row'+(ratio>1.5?', which is roughly '+Math.round(ratio).toLocaleString()+' times less':'')+'. Remember: gas prices change by the minute, an L2 adds a data fee, and the example numbers in the table are placeholders, not live data.</p></div><p class="small">What-if tool for learning only. Not a prediction and not financial advice.</p>';
}
