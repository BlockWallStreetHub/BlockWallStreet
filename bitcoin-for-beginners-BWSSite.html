function audioHTML(){
  var h='<div class="audio" id="audioBar">';
  if(TTS.ok){h+='<button class="primary" id="aPlay">▶ Listen</button><button id="aPrev" title="Previous paragraph">⏮</button><button id="aNext" title="Next paragraph">⏭</button><button id="aStop">⏹</button><span class="lab">SPEED</span><select id="rate"><option value="0.8">Slow</option><option value="0.95" selected>Normal</option><option value="1.1">Fast</option><option value="1.3">Faster</option></select><span class="lab">VOICE</span><select id="voiceSel"></select>'}
  else{h+='<span class="small">Your browser cannot read aloud. Try Microsoft Edge or Google Chrome.</span>'}
  return h+'</div>';
}
function wireAudio(){
  TTS.units=Array.prototype.slice.call(document.querySelectorAll("#lessonBody h3,#lessonBody p,#lessonBody li"));
  if(TTS.ok){
    loadVoices();
    $("#aPlay").onclick=function(){if(TTS.state==="play")pauseSay();else say(TTS.idx)};
    $("#aPrev").onclick=function(){say(Math.max(0,TTS.idx-1))};
    $("#aNext").onclick=function(){say(Math.min(TTS.units.length-1,TTS.idx+1))};
    $("#aStop").onclick=stopSay;
    $("#rate").onchange=function(){TTS.rate=parseFloat(this.value);if(TTS.state==="play")say(TTS.idx)};
    $("#voiceSel").onchange=function(){var nm=this.value;TTS.voice=TTS.voices.find(function(v){return v.name===nm});try{localStorage.setItem("bws_voice",nm)}catch(e){}if(TTS.state==="play")say(TTS.idx)};
    $("#lessonBody").onclick=function(e){if(!TTS.armed)return;var el=e.target.closest("h3,p,li");var i=TTS.units.indexOf(el);if(i>=0)say(i)};
  }
}
/* ----- lesson ----- */
var bottomSeen=false,io=null;
function openSection(n){
  if(!unlocked(n))return;
  cur=n;go("lesson");bottomSeen=false;TTS.done=false;TTS.armed=false;
  var s=SECTIONS[n-1],d=sec(n);
  var h='<div class="lessonhead"><div class="eyebrow">Section '+n+' of '+SECTIONS.length+'</div><h1>'+esc(s.title)+'</h1><div class="small">'+esc(s.sub)+'</div></div>';
  h+=audioHTML();
  h+='<div class="small" id="hint">Tip: press Listen, or tap any paragraph while the audio is on to start reading from there.</div>';
  h+='<article id="lessonBody">'+s.lesson+'</article>';
  h+='<div id="sentinel"></div><div class="gate"><div class="msg" id="gateMsg"></div><button class="primary" id="qBtn" disabled onclick="startQuiz('+n+')">Take the Section '+n+' quiz ('+s.q.length+' questions)</button><p class="small">The lesson is hidden during the quiz, so read or listen carefully first.</p></div>';
  app.innerHTML=h;
  wireAudio();
  if(io)io.disconnect();
  io=new IntersectionObserver(function(en){if(en[0].isIntersecting){bottomSeen=true;checkGate()}},{threshold:0.1});io.observe($("#sentinel"));
  checkGate();
}
function need(n){var d=sec(n);var m=minSecs(n);if(d.reread)m=Math.round(m/2);return SKIP?0:m}
function checkGate(audioDone){
  if(view!=="lesson")return;
  var n=cur,d=sec(n),m=need(n),left=Math.max(0,m-d.time);
  if(audioDone===true&&TTS.done)bottomSeen=true;
  var ok=(left===0&&(bottomSeen||SKIP))||d.read;
  var b=$("#qBtn"),g=$("#gateMsg");if(!b)return;
  b.disabled=!ok;
  g.textContent=ok?"You are ready. Good luck!":(left>0?"Quiz unlocks after about "+Math.floor(left/60)+":"+("0"+(left%60)).slice(-2)+" of reading time"+(bottomSeen?"":" and when you reach the end of the lesson")+".":"Scroll to the end of the lesson (or let the audio finish) to unlock the quiz.");
  if(ok&&!d.read){d.read=true;save()}
}
setInterval(function(){
  if(document.hidden||!S.started)return;
  if(view==="lesson"){var d=sec(cur);d.time++;S.seconds++;if(d.time%10===0)save();checkGate()}
  else if(view==="quiz"){S.seconds++}
},1000);
window.addEventListener("beforeunload",save);

/* ----- quiz ----- */
var Qz=null;
function buildItems(src){
  return shuffle(src).map(function(r){
    var opts=shuffle([0,1,2,3]).map(function(k){return {t:r[1+k],ok:k===0}});
    return {q:r[0],opts:opts,why:r[5],pick:-1};
  });
}
function startQuiz(which){
  stopSay();
  if(which==="final"){Qz={kind:"final",n:0,title:"Final Exam",items:buildItems(FINAL),i:0}}
  else{var s=SECTIONS[which-1];cur=which;Qz={kind:"sec",n:which,title:"Section "+which+" Quiz",items:buildItems(s.q),i:0}}
  go("quiz");renderQ();
}
function renderQ(){
  var it=Qz.items[Qz.i],N=Qz.items.length,answered=Qz.items.filter(function(x){return x.pick>=0}).length;
  var h='<div class="card"><div class="qhead"><span>'+esc(Qz.title)+'</span><span>Question '+(Qz.i+1)+' of '+N+'</span></div><div class="qbar"><i style="width:'+Math.round(answered/N*100)+'%"></i></div>';
  h+='<div class="qtext">'+esc(it.q)+'</div>';
  it.opts.forEach(function(o,k){h+='<button class="opt'+(it.pick===k?' sel':'')+'" onclick="pick('+k+')">'+String.fromCharCode(65+k)+'. '+esc(o.t)+'</button>'});
  h+='<div class="nav"><button class="ghost" onclick="stepQ(-1)" '+(Qz.i===0?'disabled':'')+'>← Back</button>';
  if(Qz.i<N-1)h+='<button class="primary" onclick="stepQ(1)">Next →</button>';
  else h+='<button class="primary" onclick="finishQ()">Submit answers</button>';
  h+='</div><div class="dots">';
  Qz.items.forEach(function(x,k){h+='<i class="'+(x.pick>=0?'done ':'')+(k===Qz.i?'cur':'')+'" onclick="jumpQ('+k+')">'+(k+1)+'</i>'});
  h+='</div><div class="small">'+answered+' of '+N+' answered. You can change an answer until you submit.</div>';
  if(Qz.kind==="sec")h+='<div style="margin-top:12px"><button class="ghost" onclick="leaveQuiz()">Leave quiz and go back to the lesson</button></div>';
  h+='</div>';app.innerHTML=h;
}
function pick(k){Qz.items[Qz.i].pick=k;renderQ()}
function stepQ(d){Qz.i=Math.max(0,Math.min(Qz.items.length-1,Qz.i+d));renderQ();window.scrollTo(0,0)}
function jumpQ(k){Qz.i=k;renderQ();window.scrollTo(0,0)}
function leaveQuiz(){if(confirm("Leave this quiz? Your answers will not be saved.")){openSection(Qz.n)}}
function finishQ(){
  var un=Qz.items.filter(function(x){return x.pick<0}).length;
  if(un&&!confirm(un+" question"+(un>1?"s are":" is")+" unanswered and will count as wrong. Submit anyway?"))return;
  var N=Qz.items.length,c=0;Qz.items.forEach(function(x){if(x.pick>=0&&x.opts[x.pick].ok)c++});
  var pct=Math.round(c/N*100),pass=pct>=PASS;
  var d=Qz.kind==="final"?S.final:sec(Qz.n);
  if(d.first===null||d.first===undefined)d.first=pct;
  d.attempts++;if(pct>d.best)d.best=pct;
  if(pass)d.passed=true;
  if(!pass&&Qz.kind==="sec"){d.read=false;d.reread=true;d.time=0}
  save();progress();showResult(c,N,pct,pass);
}
function showResult(c,N,pct,pass){
  go("result");
  var isFinal=Qz.kind==="final";
  var h='<div class="card score '+(pass?'':'fail')+'"><div class="eyebrow">'+esc(Qz.title)+' result</div><div class="big">'+pct+'%</div><p><b>'+c+' of '+N+' correct</b> · '+(pass?'You passed!':'You need '+PASS+'% to pass.')+'</p>';
  if(pass){
    if(isFinal)h+='<button class="primary" onclick="showCert()">Continue to my certificate →</button>';
    else if(Qz.n<SECTIONS.length)h+='<button class="primary" onclick="openSection('+(Qz.n+1)+')">Go to Section '+(Qz.n+1)+' →</button>';
    else h+='<button class="primary" onclick="startQuiz(\'final\')">Section 10 done! Start the final exam →</button> <button onclick="showBonus()">Try the DCA Calculator</button>';
    h+=' <button class="ghost" onclick="showHome()">Course map</button>';
  }else{
    if(isFinal)h+='<p>Review the sections you found hardest, then try the exam again. The questions will be shuffled.</p><button class="primary" onclick="showHome()">Back to course map</button> <button class="ghost" onclick="startQuiz(\'final\')">Retake now</button>';
    else h+='<p>Go back and read or listen to the lesson again, then retake the quiz. The questions and answers will be shuffled.</p><button class="primary" onclick="openSection('+Qz.n+')">Review the lesson</button>';
  }
  h+='</div><div class="card"><h2>Review</h2>';
  Qz.items.forEach(function(x,k){
    var right=x.pick>=0&&x.opts[x.pick].ok,good=x.opts.filter(function(o){return o.ok})[0].t;
    h+='<div class="rev"><div class="q">'+(k+1)+'. '+esc(x.q)+'</div>';
    if(right)h+='<div class="y">✔ '+esc(good)+'</div>';
    else{h+='<div class="n">✘ Your answer: '+(x.pick>=0?esc(x.opts[x.pick].t):'(no answer)')+'</div><div class="y">✔ Correct: '+esc(good)+'</div><div class="why">'+esc(x.why)+'</div>'}
    h+='</div>';
  });
  h+='</div>';app.innerHTML=h;
}

/* ----- certificate + report ----- */
function certId(){
  if(S.cert)return S.cert.id;
  var base=S.name.toUpperCase()+"|"+new Date(S.done||Date.now()).toISOString().slice(0,10)+"|"+overall();
  var h=5381;for(var i=0;i<base.length;i++){h=((h<<5)+h+base.charCodeAt(i))>>>0}
  var dt=new Date(S.done||Date.now()),p=function(n){return ("0"+n).slice(-2)};
  return "BWS-BTC-"+dt.getFullYear()+p(dt.getMonth()+1)+p(dt.getDate())+"-"+h.toString(16).toUpperCase().slice(0,6);
}
function showCert(){
  go("cert");
  if(!S.done){S.done=Date.now();save()}
  var sent=S.sent;
  var h='<div class="hero" style="padding-top:0"><div class="eyebrow">Congratulations</div><h1 style="font-size:clamp(38px,7vw,64px)">You <span>did it</span>, '+esc(S.name.split(" ")[0])+'</h1></div>';
  h+='<div class="card"><h2>Your results</h2><p><b>Overall course grade: '+overall()+'% ('+letter(overall())+')</b><br><span class="small">Section quizzes average '+sectionAvg()+'% (counts 50%). Final exam '+S.final.best+'% (counts 50%).</span></p></div>';
  if(!sent){
    h+='<div class="card"><h2>Check your name</h2><p>This is exactly what will be printed on your certificate and sent to Block Wall Street with your grades.</p><input type="text" id="cn" value="'+esc(S.name)+'"><div class="small" id="cerr" style="color:var(--bad)"></div><br><button class="primary" id="sendBtn" onclick="finish()">Looks right. Make my certificate and send my report</button></div>';
  }else{
    h+=certBlock();
  }
  app.innerHTML=h;

}
function certBlock(){
  return '<div id="sendStatus"></div><div class="card"><canvas id="cert" width="1600" height="1130"></canvas><div class="nav" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary" onclick="dlCert()">⬇ Download certificate (PNG)</button><button onclick="printCert()">🖨 Print / save as PDF</button><button onclick="showBonus()">DCA Calculator</button><button class="ghost" onclick="showHome()">Course map</button></div></div>';

function finish(){
  var n=$("#cn").value.trim().replace(/\s+/g," ");
  if(n.length<3||n.indexOf(" ")<0){$("#cerr").textContent="Please enter your first and last name.";return}
  S.name=n;S.cert=null;S.cert={id:certId()};S.sent=true;S.reportSent=false;save();
  showCert();
  $("#sendStatus").innerHTML='<div class="status warn">Sending your report to Block Wall Street…</div>';
  drawCert().then(function(){return sendReport()});
}
function report(){
  var L=[];
  L.push("BLOCK WALL STREET — BITCOIN FOR BEGINNERS — COMPLETION REPORT");

var BONUS_TEXT='<div class="lessonhead"><div class="eyebrow">Bonus tool</div><h1>The DCA Calculator</h1><div class="small">A what-if machine for steady buying. Easy walk-through first, then try it yourself.</div></div>'+
'<article id="lessonBody">'+
'<h3>What is this tool?</h3>'+
'<p>You learned in Section 9 that dollar-cost averaging, or DCA, means buying a fixed dollar amount on a schedule, no matter what the price is. This calculator lets you test that idea. It is a what-if machine. It does not know the future, and it does not predict anything. It simply shows what steady buying would do in different price stories.</p>'+
'<div class="stepcard"><h3>Step 1: How much each time?</h3>'+
'<p>In the first box, type the number of dollars you would put in on each buy. Start small, like 25 dollars. Small and steady beats big and scary.</p>'+

'<h3>Step 4: What is the starting price?</h3>'+
'<p>This is what one bitcoin costs on your very first buy. Press the Get today’s price button, or type any number you like. Typing a number is great for exploring.</p>'+
'<h3>Step 5: Pick a story for where the price ends up</h3>'+
'<p>Tap one of the buttons: price falls in half, stays flat, doubles, or goes up five times. You can also type your own ending price. Nobody knows which story will happen, so try them all. A smart planner asks, “Could I live with the bad story?”</p>'+
'<h3>Step 6: Ups and downs</h3>'+
'<p>Leave the ups and downs box checked. Real bitcoin zigzags up and down along the way. When the price dips, your same dollars buy more bitcoin. That is the secret power of DCA. Uncheck the box to see a smooth, straight-line price instead.</p>'+

 ["Coinbase","https://api.coinbase.com/v2/prices/BTC-USD/spot",function(j){return +j.data.amount}],

function loadLive(setScen){

function money(v){var a=Math.abs(v);return (v<0?"-":"")+"$"+(a>=100?Math.round(a).toLocaleString():a.toFixed(2))}
function calc(){
  var out=$("#c_out");if(!out)return;
  var amt=+$("#c_amt").value,ppy=+$("#c_freq").value,yrs=+$("#c_yrs").value,sp=+$("#c_start").value,ep=+$("#c_end").value,fee=(+$("#c_fee").value||0)/100,bump=$("#c_bump").checked;
  if(!(amt>0&&yrs>0&&sp>0&&ep>0)){out.innerHTML='<p class="small">Fill in every box with a number above zero to see your results.</p>';return}
  var N=Math.max(2,Math.round(yrs*ppy)),btc=0,invested=0,vals=[],invs=[],cycle=ppy*0.75;
  for(var i=0;i<N;i++){
    var f=i/(N-1),p=sp*Math.pow(ep/sp,f);
    if(bump&&i<N-1){p*=1+0.3*Math.sin(2*Math.PI*i/cycle)*(1-f*0.6)}
    btc+=amt*(1-fee)/p;invested+=amt;
    var endNow=(i===N-1)?ep:p;vals.push(btc*endNow);invs.push(invested);
  }
  var worth=btc*ep,gain=worth-invested,pct=gain/invested*100,avg=invested/btc;
  var lumpBtc=invested*(1-fee)/sp,lumpWorth=lumpBtc*ep,lumpPct=(lumpWorth-invested)/invested*100;
  var cls=gain>=0?"up":"dn";
  var h='<div class="res">'+
   '<div><small>You put in</small><b>'+money(invested)+'</b></div>'+
   '<div><small>You own</small><b>'+btc.toFixed(6)+' BTC</b><br><span class="small">'+Math.round(btc*1e8).toLocaleString()+' sats</span></div>'+
   '<div><small>Your average cost</small><b>'+money(avg)+'</b><br><span class="small">per whole bitcoin</span></div>'+
   '<div><small>Worth at the end</small><b>'+money(worth)+'</b></div>'+
   '<div><small>Gain or loss</small><b class="'+cls+'">'+(gain>=0?"+":"")+money(gain)+' ('+(pct>=0?"+":"")+pct.toFixed(1)+'%)</b></div>'+
   '<div><small>Lump sum on day one</small><b>'+money(lumpWorth)+'</b><br><span class="small">'+(lumpPct>=0?"+":"")+lumpPct.toFixed(1)+'%</span></div></div>';
  h+=chart(vals,invs,yrs);
  var better=worth>=lumpWorth?"Steady buying (DCA) did better than the lump sum in this story.":"The lump sum did better than steady buying in this story. That happens when the price climbs early. DCA still gave you a calmer ride.";
  h+='<div class="callout"><p><b>In plain words:</b> You would put in '+money(amt)+' '+({365:"every day",52:"every week",26:"every two weeks",12:"every month"})[ppy]+' for '+yrs+' year'+(yrs===1?"":"s")+', which is '+N+' buys and '+money(invested)+' in total. That would collect about '+btc.toFixed(4)+' bitcoin at an average cost of '+money(avg)+'. If the price ends at '+money(ep)+', your bitcoin would be worth '+money(worth)+', a '+(gain>=0?"gain":"loss")+' of '+money(Math.abs(gain))+'. '+better+'</p></div>';
  h+='<p class="small">What-if tool for learning only. Not a prediction and not financial advice.</p>';
  out.innerHTML=h;
}
function chart(vals,invs,yrs){
  var W=700,H=250,L=58,R=12,T=14,B=30,n=vals.length,max=Math.max.apply(null,vals.concat(invs))*1.08||1;
  function X(i){return L+(W-L-R)*i/(n-1)}function Y(v){return T+(H-T-B)*(1-v/max)}
  function path(a){var s="";var step=Math.max(1,Math.floor(n/300));for(var i=0;i<n;i+=step){s+=(s?"L":"M")+X(i).toFixed(1)+" "+Y(a[i]).toFixed(1)}s+="L"+X(n-1).toFixed(1)+" "+Y(a[n-1]).toFixed(1);return s}
  var g="";for(var k=0;k<=4;k++){var v=max*k/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#25416b" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" fill="#9fb2cf" font-size="11" text-anchor="end" font-family="DM Mono,monospace">'+(v>=1e6?"$"+(v/1e6).toFixed(1)+"M":v>=1e3?"$"+Math.round(v/1e3)+"k":"$"+Math.round(v))+'</text>'}
  var xs="";[0,0.5,1].forEach(function(f){xs+='<text x="'+(L+(W-L-R)*f)+'" y="'+(H-8)+'" fill="#9fb2cf" font-size="11" text-anchor="'+(f===0?"start":f===1?"end":"middle")+'" font-family="DM Mono,monospace">'+(f===0?"Start":(yrs*f).toFixed(1).replace(".0","")+" yr")+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:#0b1a31;border:1px solid var(--line);border-radius:12px" role="img" aria-label="Chart of money put in versus value over time">'+g+xs+'<path d="'+path(invs)+'" fill="none" stroke="#9fb2cf" stroke-width="2.5"/><path d="'+path(vals)+'" fill="none" stroke="#f0b429" stroke-width="3"/><text x="'+(L+8)+'" y="'+(T+14)+'" fill="#f0b429" font-size="12" font-family="DM Mono,monospace">● Worth along the way</text><text x="'+(L+190)+'" y="'+(T+14)+'" fill="#9fb2cf" font-size="12" font-family="DM Mono,monospace">● Money put in</text></svg>';

}
function tryCode(c){
  c=String(c||"").trim().toUpperCase();
  if(!c){gateScreen("Please type your code.");return}
  fetch(WORKER_URL+"/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:c})})
  .then(function(r){return r.json()}).then(function(j){
    if(j&&j.ok){ACCESS_CODE=c;try{localStorage.setItem(CODE_KEY,c)}catch(e){} if(j.name&&!S.name){S.name=j.name;save()} showWelcome()}
    else gateScreen((j&&j.error)||"That code did not work.");
  }).catch(function(){
    var cached="";try{cached=localStorage.getItem(CODE_KEY)||""}catch(e){}
    if(cached&&cached===c){ACCESS_CODE=c;showWelcome()} else gateScreen("Could not reach the access server. Check your internet and try again.");
  });
}
if(!WORKER_URL||SKIP){showWelcome()}
else{var sc="";try{sc=localStorage.getItem(CODE_KEY)||""}catch(e){} if(sc){app.innerHTML='<p style="text-align:center;margin-top:60px">Checking your access...</p>';tryCode(sc)}else gateScreen("")}
</script>
</body>
</html>
