title:"Money: Where It Came From and Why It Breaks",
sub:"Barter, gold, banks, inflation and the 2008 crisis. The story that sets up Bitcoin.",
lesson:`
<h3>What is money, really?</h3>
<p>Money is a tool. It is not magic and it is not the same thing as wealth. Money is a tool that lets millions of people who have never met trade with each other. A good tool does three jobs. First, it is a <b>medium of exchange</b>, which means you can swap it for things you want. Second, it is a <b>store of value</b>, which means it should still be worth something next month or next year. Third, it is a <b>unit of account</b>, which means we use it to put prices on things so we can compare them.</p>
<p>Keep those three jobs in your head. Later in this course, when we ask whether Bitcoin is good money, we will check it against these same three jobs.</p>

<h3>Life before money: barter</h3>
<p>Long ago, people traded goods directly. This is called <b>barter</b>. Imagine you are a farmer with extra corn, and you need new shoes. The shoemaker does not want corn today. The shoemaker wants a haircut. So you must find a barber who wants corn, get a haircut ticket, trade the ticket to the shoemaker, and finally get your shoes. Barter only works when two people happen to want exactly what the other has. Economists call this problem the <b>double coincidence of wants</b>. It is slow, and it is a headache.</p>
<p>The fix was to pick one item that everyone would accept, then trade everything else for that item first. That item became money.</p>

<h3>The six traits of good money</h3>
<p>Over thousands of years people tried salt, seashells, beads, cattle and metals. Some worked better than others. Here are the traits that separate good money from bad money:</p>
<ul>
<li><b>Durable.</b> It does not rot, rust or break. Fresh fruit fails this test.</li>
<li><b>Portable.</b> You can carry it. A herd of cattle fails this test.</li>
<li><b>Divisible.</b> You can split it for small purchases. A cow is hard to split into change.</li>
<li><b>Scarce.</b> It is hard to make more of it. If anyone can make it easily, it becomes worthless. Think about it: if seashells washed up on every beach by the truckload, they would be a bad money.</li>
<li><b>Uniform.</b> One unit is the same as any other unit. Money with this trait is called <b>fungible</b>. One gold coin of the same weight and purity equals another.</li>
<li><b>Accepted.</b> Other people will take it too.</li>
</ul>
<p>Gold scored well on most of these traits, which is why many civilizations used it. Gold is durable, can be cut and melted into coins, and is hard to find and dig up. That last part is what keeps it scarce.</p>

<h3>A strange example: the stone money of Yap</h3>
<p>On the island of Yap in the Pacific, people used giant stone discs called <b>rai stones</b> as money. Some were taller than a person and far too heavy to carry. So when a stone was traded, it stayed where it was. The whole community simply remembered who owned it now. In other words, the island ran on a shared memory of who owns what, which is a <b>ledger</b>. Remember that word. A ledger is a record of who owns what, and it is at the heart of Bitcoin.</p>

<h3>Gold, paper receipts and the birth of banks</h3>
<p>Carrying gold around is risky because thieves love it. So people stored their gold with a goldsmith who had a strong vault. The goldsmith handed back a paper receipt. Soon people realized they could just trade the receipts instead of hauling the gold. Receipts became money.</p>
<p>Then the goldsmith noticed something. Almost nobody came to pick up their gold on any given day. So the goldsmith could write extra receipts, lend them out, and charge interest, even though the vault did not hold enough gold to cover all of them. This practice is called <b>fractional reserve banking</b>. It works fine until everyone shows up at once to get their gold. When that happens it is called a <b>bank run</b>, and the bank may not have enough to pay everybody.</p>

<h3>The gold link is cut: fiat money</h3>
<p>For a long time, governments promised that their paper dollars could be traded in for gold. This was the gold standard. On <b>August 15, 1971</b>, U.S. President Richard Nixon ended the promise to swap dollars for gold. After that, the dollar became <b>fiat money</b>. The word fiat comes from a Latin word meaning “let it be done.” Fiat money has value because the government says so and because people trust it and use it to pay taxes, not because it can be traded for a metal.</p>
<p>Fiat money is flexible. A central bank, like the U.S. Federal Reserve, can create more of it when it wants to. That flexibility can help in emergencies. It also creates a danger.</p>

<h3>Inflation: when your money shrinks</h3>
<p><b>Inflation</b> means prices go up over time, which also means each dollar buys less than before. When the amount of money in a country grows faster than the amount of real goods, prices rise. A small amount, around 2 percent a year, is the Federal Reserve’s target in the United States. Over many years even small inflation adds up, and your savings slowly lose buying power.</p>
<p>When inflation goes wild, it is called <b>hyperinflation</b>. In Germany in 1923, prices climbed so fast that people carried money in wheelbarrows and workers rushed to spend wages before they lost value. Venezuela and Zimbabwe have suffered similar disasters in recent decades. People in those countries searched for ways to protect their savings, such as foreign currency and gold.</p>

<h3>Today’s money is a number in someone else’s computer</h3>
<p>When you check your bank balance, you are not looking at coins in a box. You are looking at a number in the bank’s computer. You trust the bank to keep that number correct. Banks can also freeze accounts, delay payments, add fees, or close an account. International transfers can take days and cost a lot. The World Bank reported in 2021 that around 1.4 billion adults in the world still had no bank account at all. They are called <b>unbanked</b>.</p>

<h3>Why this matters for community wealth</h3>
<p>Communities that control their own financial tools can build wealth that lasts. The Greenwood district in Tulsa, Oklahoma, known as Black Wall Street, was a thriving Black business district in the early 1900s with banks, shops and professionals who kept dollars circulating inside the community. On May 31 and June 1, 1921, a white mob attacked and destroyed it. Decades later, practices like redlining kept banks from lending fairly in many Black neighborhoods. The lesson many people draw is simple: if others control the doors to the money system, they can close those doors. That is part of why Block Wall Street teaches about tools like Bitcoin.</p>

<h3>The 2008 crisis: the final push</h3>
<p>In the mid-2000s, many banks made risky home loans, bundled them into complicated investments, and sold them around the world. When homeowners could not repay, the whole structure collapsed. The big investment bank Lehman Brothers failed on <b>September 15, 2008</b>. Governments stepped in. In the United States, Congress approved up to <b>$700 billion</b> in October 2008 to rescue the financial system. Many ordinary people asked a fair question: why do we have to depend on middlemen who gamble with our money, and then get rescued when they lose?</p>

<h3>The digital copy problem</h3>
<p>Here is a puzzle that stumped computer scientists for years. Anything digital can be copied. If you email a photo to a friend, you both have the photo. Now imagine money was just a computer file. You could copy the file and spend it twice. This is called the <b>double-spending problem</b>. Before Bitcoin, the only fix was a trusted referee, like a bank, that kept the official ledger and checked every payment. Could computers do the referee’s job without a boss in charge? That question leads us straight into the next section.</p>

<div class="callout"><p><b>Key takeaways.</b> Money does three jobs: exchange, store of value and unit of account. Good money is durable, portable, divisible, scarce, uniform and accepted. Fiat money replaced the gold link in 1971, and inflation slowly shrinks savings. Most money today relies on trusted middlemen. Digital files can be copied, which creates the double-spending problem.</p></div>
`,

sub:"Public keys, hashes, the Cypherpunks, and the failed attempts that came before Bitcoin.",
lesson:`
<h3>Bitcoin did not come out of nowhere</h3>
<p>Many people think Bitcoin appeared like a bolt of lightning. In truth, it was built from ideas that smart people had worked on for more than thirty years. Some of those ideas worked. Many of the projects failed. Satoshi Nakamoto, the mysterious creator of Bitcoin, studied those failures and put the best pieces together. To understand Bitcoin, we need to meet the pieces.</p>

<h3>Tool one: encryption and public keys</h3>
<p><b>Cryptography</b> is the science of keeping information secret and proving it is real. For most of history, to send a secret message, you and your friend both needed the same secret code. But how do you share that code safely in the first place? That puzzle was solved in the 1970s. In 1976, Whitfield Diffie and Martin Hellman described a new idea, and in 1977 Ron Rivest, Adi Shamir and Leonard Adleman built a system called <b>RSA</b>. It is called <b>public-key cryptography</b>.</p>
<p>Here is the idea. You make a pair of keys that are mathematically linked. One is your <b>public key</b>, which you can hand out to anyone. The other is your <b>private key</b>, which you never share. Think of a mailbox with a slot in the front. Anyone can drop a letter in the slot, which is like the public key. But only you hold the key that opens the box, which is like the private key.</p>
<p>The same idea works backward to make a <b>digital signature</b>. You use your private key to sign a message. Anyone can use your public key to check that the signature is real. They can tell it could only have been made by the owner of that private key, and that the message was not changed. Bitcoin uses signatures for every single payment.</p>

<h3>Tool two: the hash, a digital fingerprint</h3>
<p>A <b>hash function</b> is a recipe that takes any amount of data and turns it into a short, fixed-size string of letters and numbers called a <b>hash</b>. Think of it as a fingerprint for data. Three rules make hashes powerful. First, the same input always gives the same fingerprint. Second, change even one tiny thing, like one letter, and the fingerprint becomes totally different. Third, it only goes one way: you cannot work backward from the fingerprint to the original data. Bitcoin uses a hash function called SHA-256.</p>

<h3>Tool three: the timestamp chain</h3>
<p>In 1991, two researchers named Stuart Haber and W. Scott Stornetta published a method to prove a digital document existed at a certain time, without trusting a single company. They linked timestamps together in a chain, so that changing an old record would break every record after it. Another earlier idea, from 1979, was the <b>Merkle tree</b> by Ralph Merkle, a way to bundle many pieces of data into one fingerprint. Both ideas later appear inside Bitcoin.</p>

<h3>David Chaum and DigiCash</h3>
<p>In the 1980s, a computer scientist named <b>David Chaum</b> worried that digital payments would let companies and governments watch everything people buy. He invented a technique called <b>blind signatures</b> that let a bank approve a digital coin without knowing who was spending it. In 1989 he founded a company called <b>DigiCash</b> and built an electronic cash system called ecash. Some banks tested it, including Mark Twain Bank in St. Louis. But DigiCash had a big weakness: it depended on one company running the central system. Banks were slow to adopt it, and DigiCash went bankrupt in 1998. When the company died, the money died with it.</p>

<h3>The Cypherpunks</h3>
<p>In 1992, a small group met in the San Francisco Bay Area. Its founders included Eric Hughes, Tim May and John Gilmore. They started a mailing list for people who believed strong cryptography could protect personal freedom in the digital age. They called themselves <b>Cypherpunks</b>. Their motto was “Cypherpunks write code,” meaning they did not just argue, they built software. In 1993, Eric Hughes wrote “A Cypherpunk’s Manifesto,” which argued that privacy is necessary for an open society in the electronic age.</p>
<p>Back then, the U.S. government treated strong encryption almost like a weapon and limited its export. In 1991, Phil Zimmermann released a free email encryption program called <b>PGP</b>, and later faced a government investigation for it. These fights are sometimes called the “crypto wars.” Many future Bitcoin figures were on the Cypherpunk list, including Hal Finney, Adam Back, Nick Szabo and Wei Dai.</p>

<h3>E-gold: a warning</h3>
<p>In 1996, a business called <b>e-gold</b> launched. Customers could hold digital money backed by real gold, and it grew to millions of accounts. But everything ran through one company. In 2008, e-gold’s owners pleaded guilty to charges related to money laundering and running an unlicensed money transmitting business, and the service wound down. The lesson, again: a central company is a single target.</p>

<h3>Hashcash: making work count</h3>
<p>In 1997, British cryptographer <b>Adam Back</b> proposed <b>Hashcash</b> as a way to fight email spam. The idea: before your email is accepted, your computer must do a small amount of work, like solving a puzzle that takes a moment. A normal person would barely notice. A spammer sending millions of messages would need huge amounts of computing power. This idea is called <b>proof of work</b>. It is work that is hard to do but very easy for others to check. Bitcoin uses the same principle to secure its network.</p>

<h3>b-money and bit gold</h3>
<p>In 1998, a Cypherpunk named <b>Wei Dai</b> described <b>b-money</b>, a plan where everyone in a network keeps their own record of who owns what, and new money is created by doing computing work. The same year, <b>Nick Szabo</b> designed <b>bit gold</b>, which also used puzzles. Each solved puzzle became part of a chain, and each new puzzle built on the last. He wrote about it more widely in 2005. Both ideas were brilliant sketches. But neither explained how strangers on a network could agree on one version of the truth when some of them might lie.</p>

<h3>Hal Finney and RPOW</h3>
<p>In 2004, <b>Hal Finney</b>, a respected Cypherpunk and programmer, built a system called <b>RPOW</b>, short for Reusable Proof of Work. It turned proof-of-work tokens into something that could be passed from person to person. But it still relied on a single trusted server to stop double spending. Finney would later become the first person besides Satoshi to run Bitcoin.</p>

<h3>The puzzle that was still missing</h3>
<p>By the mid-2000s the pieces were on the table: public keys, signatures, hashes, timestamp chains, and proof of work. What was missing was a way for thousands of strangers, who do not trust each other, to agree on a single shared ledger without a boss. There was also a trick that attackers could use called a <b>Sybil attack</b>, where one person pretends to be thousands of people to outvote everyone else. A system based on one-person-one-vote would be easy to cheat. In 2008, a document arrived that solved these problems all at once. That is the subject of the next section.</p>

<div class="callout"><p><b>Key takeaways.</b> Public-key cryptography gives us signatures. Hashes give us digital fingerprints. Haber and Stornetta gave us chained timestamps. Chaum’s DigiCash and e-gold showed that a central company is a weak point. Hashcash gave us proof of work. b-money, bit gold and RPOW came close but needed a trusted server or could not stop fake identities.</p></div>

title:"Satoshi and the White Paper (2008–2009)",
sub:"The email that started it all, a walk through all 12 parts of the white paper, and the first blocks.",
lesson:`
<div class="callout paper"><p><b>Read the original.</b> The Bitcoin white paper is only nine pages long. It is free and the license lets anyone share it. Open it in a new tab and follow along as you go through this section. The official link is <a href="https://bitcoin.org/bitcoin.pdf" target="_blank" rel="noopener">bitcoin.org/bitcoin.pdf</a>. A copy for this course is also saved as <a href="bitcoin-whitepaper.pdf" target="_blank" rel="noopener">bitcoin-whitepaper.pdf</a> (it opens if the PDF file sits in the same folder as this course).</p></div>

<h3>The world in 2008</h3>
<p>By the autumn of 2008, the financial world was shaking. Lehman Brothers had failed in September, banks were being rescued, and trust in the money system was low. In that moment, on <b>October 31, 2008</b>, someone using the name <b>Satoshi Nakamoto</b> sent an email to a small cryptography mailing list. The message said Satoshi had been working on a new electronic cash system that was fully peer-to-peer, with no trusted third party. It included a link to a short paper titled <b>“Bitcoin: A Peer-to-Peer Electronic Cash System.”</b></p>
<p><b>Peer-to-peer</b> means the computers talk directly to each other as equals, without a boss computer in the middle. Think of friends passing notes around a classroom instead of everyone going through the teacher.</p>
<p>The reaction was mixed. Some list members were curious. Others raised hard questions about whether the design could grow big enough. It was not an instant sensation. It was a quiet start.</p>

<h3>A walk through the white paper, part by part</h3>
<p>The paper has 12 short parts. Here is each part in plain language.</p>
<ul>
<li><b>1. Introduction.</b> Online payments rely on trusted middlemen like banks. That causes fees, delays, and the possibility of reversals and fraud. Satoshi proposes a system based on cryptographic proof instead of trust.</li>
<li><b>2. Transactions.</b> A coin is a chain of digital signatures. Each owner signs a message passing the coin to the next owner. The problem is that the receiver cannot be sure the previous owner did not spend the same coin somewhere else.</li>
<li><b>3. Timestamp server.</b> Take a batch of transactions, hash it, and publish the hash widely. Each timestamp includes the one before it, forming a chain.</li>
<li><b>4. Proof of work.</b> To add a batch to the chain, a computer must find a special number so that the batch’s hash begins with a required number of zeros. It takes lots of tries to find but one quick try to check. Changing an old batch would mean redoing all the work after it. The paper calls this “one-CPU-one-vote,” and the longest chain is the one with the most work behind it.</li>
<li><b>5. Network.</b> New transactions are broadcast to everyone. Computers called nodes collect them into a block, work on the proof of work, and when one finds it, it shares the block. Other nodes accept it if every transaction is valid and then build the next block on top of it.</li>
<li><b>6. Incentive.</b> The first transaction in each block creates brand new coins for whoever found the block. Later, transaction fees can also pay them. This gets coins into circulation without a central bank and gives people a reason to play fair.</li>
<li><b>7. Reclaiming disk space.</b> Old transactions that are buried deep can be dropped to save space while keeping the block fingerprints, using a Merkle tree. The paper estimates that block headers alone would take about 4.2 megabytes of storage per year.</li>
<li><b>8. Simplified payment verification.</b> A person can check that a payment is in the chain by keeping only the block headers, not the whole history.</li>
<li><b>9. Combining and splitting value.</b> A transaction can have many inputs and outputs, like paying with several bills and getting change back.</li>
<li><b>10. Privacy.</b> Everyone can see transactions, but names are not attached. Public keys act like anonymous labels, and using a new key pair for each transaction helps keep identities private.</li>
<li><b>11. Calculations.</b> This part uses math to show how hard it is for an attacker to rewrite history. The chance falls fast with every extra block. In the paper’s table, an attacker with 10 percent of the computing power has less than a 0.1 percent chance after the payment is 5 blocks deep. With 30 percent of the power, it takes 24 blocks to get below 0.1 percent.</li>
<li><b>12. Conclusion.</b> The system works without trust, as long as honest nodes control most of the computing power.</li>
</ul>
<p>A fun fact: the word “blockchain” never appears in the white paper. Satoshi wrote about a “chain of blocks” and a “proof-of-work chain.” The one-word term came later.</p>

<h3>The Genesis Block: January 3, 2009</h3>
<p>On <b>January 3, 2009</b>, Satoshi mined the very first block, called the <b>Genesis Block</b> or block 0. The reward was 50 bitcoins, though that first reward cannot be spent. Satoshi buried a message inside this block, a newspaper headline from that day’s London <i>Times</i>: “Chancellor on brink of second bailout for banks.” It was a timestamp that proved the block could not have been made before that date. It was also a pointed reminder of why Bitcoin was invented.</p>
<p>The Bitcoin software was released to the public around January 8, 2009. At first, only a few people ran it.</p>

<h3>The first payment</h3>
<p>Hal Finney, the Cypherpunk you met last section, downloaded the software and posted the simple words “Running bitcoin” on January 11, 2009. The next day, January 12, Satoshi sent Hal <b>10 bitcoins</b> in block 170. That was the first Bitcoin payment between two people.</p>

<h3>Who is Satoshi?</h3>
<p>Nobody knows. The name sounds Japanese, and an online profile once claimed Satoshi was a man born in 1975 living in Japan, but nothing has been proven. Satoshi wrote in excellent English, and the code and messages do not settle the question. Many people have been named as possible Satoshi, and many have denied it. In March 2024, a UK High Court ruled that Craig Wright, who had publicly claimed to be Satoshi, was not. Researchers estimate that Satoshi mined roughly one million bitcoins in the early days. Those coins have never been moved.</p>
<p>Satoshi stayed active in 2009 and 2010. Then, in April 2011, Satoshi sent a final private email saying they had moved on to other things. A developer named Gavin Andresen became the lead for a time and the project passed to a growing group of volunteers.</p>
<p>Many fans like the fact that Bitcoin has no founder in charge. Nobody can call Satoshi to change the rules.</p>

<div class="callout"><p><b>Key takeaways.</b> Satoshi announced Bitcoin on October 31, 2008. The white paper has 12 parts and nine pages. The Genesis Block was mined January 3, 2009, with a newspaper headline inside. The first person-to-person payment was 10 bitcoins to Hal Finney on January 12, 2009. Satoshi vanished in 2011 and has never been proven to be any one person.</p></div>
`,

title:"The Early Years (2009–2013)",
sub:"From worthless code to the first pizza, the first exchange, the first crash and the first $1,000.",
lesson:`
<h3>A price of nothing</h3>
<p>When Bitcoin started in 2009, it had no price at all. Nobody was selling it, so nobody could say what a bitcoin was worth. People mined it on ordinary home computers, mostly for fun and curiosity. The first published exchange rate came on <b>October 12, 2009</b>, when a website called New Liberty Standard set a rate of <b>1,309.03 bitcoins for one U.S. dollar</b>. They came up with that number by estimating the cost of the electricity a computer used to make bitcoins. In other words, the first price came from the cost of the work, not from a market.</p>

<h3>Bitcoin Pizza Day: May 22, 2010</h3>
<p>On a forum called Bitcointalk, a programmer in Florida named <b>Laszlo Hanyecz</b> offered 10,000 bitcoins to anyone who would order him pizza. A man known online as Jercos accepted, and two Papa John’s pizzas were delivered. That was the first known time bitcoins were used to buy a real item. At the time the coins were worth about $41. People celebrate May 22 every year as <b>Bitcoin Pizza Day</b>. It is also a famous lesson about patience, because those 10,000 coins later became worth hundreds of millions of dollars, and at the 2025 peak well over a billion.</p>

<h3>The first exchange and the first spike</h3>
<p>For Bitcoin to have a price, people needed a place to trade it. In July 2010 a website called <b>Mt. Gox</b> turned into a Bitcoin exchange. It began its life as a site for trading cards from the game Magic: The Gathering, and the name stood for “Magic: The Gathering Online eXchange.” A programmer named Jed McCaleb started it and sold it in 2011 to Mark Karpelès. Around the same time, a popular tech news site called Slashdot wrote about Bitcoin, and the price jumped roughly tenfold in a few days from fractions of a cent to several cents. At its peak, Mt. Gox handled most Bitcoin trading in the world. Keep that in mind, because it matters in the next section.</p>

<h3>The 184 billion bitcoin bug: August 15, 2010</h3>
<p>On <b>August 15, 2010</b>, someone discovered that a bug in the code let a transaction create about <b>184 billion bitcoins</b> out of thin air. The problem was an overflow, like a car odometer that flips back to zero. Within hours, the developers found it, released a fixed version, and the network agreed to throw out the bad block and follow the corrected chain. The bug showed two things. Bitcoin’s software was written by humans and could have mistakes. It also showed that the community could respond fast. The 21 million limit was restored.</p>

<h3>Parity with the dollar: February 2011</h3>
<p>On <b>February 9, 2011</b>, one bitcoin reached a price of one U.S. dollar for the first time. That same month a hidden website called <b>Silk Road</b> launched on the dark web. It was a marketplace where people sold illegal goods and paid with bitcoin. The site was created by Ross Ulbricht, who used the name “Dread Pirate Roberts.” Silk Road gave Bitcoin a bad reputation and, for a while, a lot of its early demand. The FBI shut it down in October 2013. Ulbricht was sentenced to life in prison in 2015 and received a pardon in January 2025.</p>
<p>Many people wrongly think Bitcoin was invented for crime. The paper never mentions it, and the public ledger actually makes crime easier to trace than cash. But the early link stuck in the public mind.</p>

<h3>The first big boom and bust: 2011</h3>
<p>In June 2011, the price rocketed to around $31 as news stories spread. Then Mt. Gox was hacked, and after that the price crashed. By late 2011 a bitcoin was worth only about $2. It had lost about 90 percent of its value. This was the first of many boom-and-bust cycles that Bitcoin would go through. Each time, it survived.</p>

<h3>Building the ecosystem</h3>
<p>During these years, businesses started to appear. In 2011, <b>BitPay</b> began helping merchants accept Bitcoin. <b>Bitcoin Magazine</b> began publishing in 2011, co-founded by a young writer named Vitalik Buterin, who later created Ethereum. In 2012, <b>Coinbase</b> was founded, and in September 2012 the <b>Bitcoin Foundation</b> was formed to support developers and spread the word.</p>

<h3>The first halving: November 28, 2012</h3>
<p>Bitcoin’s code says that the reward for finding a new block is cut in half about every four years, or more exactly every 210,000 blocks. This is called the <b>halving</b>. On <b>November 28, 2012</b>, the reward dropped from 50 bitcoins to <b>25 bitcoins</b> per block. A halving slows the speed at which new bitcoins are created, which is one reason Bitcoin is called scarce. It is part of a plan that ends with a cap of 21 million coins.</p>

<h3>2013: Cyprus, $1,000 and China</h3>
<p>In March 2013, the island nation of Cyprus had a banking crisis. Banks closed for days, and the government took a share of savings above a certain size in some banks. Many people saw that as a lesson about how fragile bank deposits can be, and interest in Bitcoin grew. In April the price shot past $200 and then fell by more than half.</p>
<p>In October 2013, the first Bitcoin ATM opened in a coffee shop in Vancouver, Canada. In the same month, the FBI shut down Silk Road. In November 2013 the price of one bitcoin crossed <b>$1,000</b> for the first time. Then in December, China’s central bank told financial companies in China not to deal in Bitcoin, and the price dropped sharply. A pattern was forming: big news makes the price jump, bad news makes it crash.</p>

<div class="callout"><p><b>Key takeaways.</b> The first price came from electricity costs in October 2009. Pizza Day was May 22, 2010, with 10,000 coins spent. The 184 billion coin bug of August 15, 2010 was fixed in hours. Bitcoin hit $1 in February 2011 and fell to about $2 after the 2011 crash. The first halving came on November 28, 2012, cutting the reward from 50 to 25. Bitcoin first crossed $1,000 in November 2013.</p></div>
`,

sub:"The Mt. Gox collapse, the block size wars, the 2017 boom and the long crypto winter.",
lesson:`
<h3>The collapse of Mt. Gox: February 2014</h3>
<p>By early 2014, the exchange Mt. Gox, which you met last section, was in trouble. Customers were having trouble withdrawing. Mt. Gox halted withdrawals in early February 2014, its website went dark on February 24, and it filed for bankruptcy a few days later. The company said about <b>850,000 bitcoins</b> were missing. About 750,000 of them belonged to customers and about 100,000 belonged to the company. Later, roughly 200,000 coins were found, but most of the rest never came back. At that time, this was an enormous share of all the bitcoins in existence.</p>
<p>What went wrong? Investigations pointed to a mix of poor security, bad management and theft that went on for years. Mt. Gox’s boss, Mark Karpelès, was later convicted in Japan on a data-manipulation charge in 2019 but cleared of the larger embezzlement charge.</p>
<p>The price crashed from over $1,000 to a low of about $200 by early 2015. Many people said Bitcoin was dead. But look closely at what actually failed. It was not the Bitcoin network. It was a company that held other people’s coins. This is the origin of a famous saying: <b>“Not your keys, not your coins.”</b> If someone else holds the keys to your bitcoin, you are trusting them, and that is exactly what Bitcoin was designed to avoid.</p>

<h3>The quiet builders</h3>
<p>From 2014 to 2016, the price moved sideways and the news was gloomy. Meanwhile developers kept working. In July 2015, a younger project called <b>Ethereum</b>, created by Vitalik Buterin and others, went live. It aimed to run small computer programs on a blockchain. That started a whole new world of other cryptocurrencies. On <b>July 9, 2016</b>, Bitcoin had its second halving, and the block reward fell from 25 to <b>12.5 bitcoins</b>.</p>

<h3>The block size wars</h3>
<p>Early on, Satoshi had put a limit on how big one block could be: about <b>1 megabyte</b>. That kept the network lightweight so ordinary computers could keep up. As more people used Bitcoin, blocks filled up, fees rose, and payments took longer. A bitter fight began about what to do.</p>
<ul>
<li><b>The “big block” camp</b> said: make the blocks bigger so more payments fit on the main chain.</li>
<li><b>The “small block” camp</b> said: bigger blocks will make it too costly for regular people to run nodes, which would make Bitcoin less decentralized. Better to build extra layers on top.</li>
</ul>
<p>Between 2015 and 2017, several proposals came and went, including Bitcoin XT and Bitcoin Classic. The fight got personal and loud. It taught people something important about Bitcoin: nobody is in charge. No company or founder could simply decide. Changes only happen if the people running the software agree to run it.</p>

<h3>SegWit and the first big split</h3>
<p>A compromise upgrade called <b>Segregated Witness</b>, or <b>SegWit</b>, moved signature data into a separate area. This made room for more transactions and fixed a bug called transaction malleability, which made some advanced tools easier to build. SegWit activated on <b>August 24, 2017</b>.</p>
<p>Not everyone liked this path. On <b>August 1, 2017</b>, a group of big-block supporters split off and created a new coin called <b>Bitcoin Cash</b>, with larger blocks. This kind of split is called a <b>fork</b>. The original chain kept the name Bitcoin (BTC). Anyone who held bitcoins before the split received an equal amount of Bitcoin Cash. Another planned upgrade, called SegWit2x, was canceled in November 2017 when the agreement fell apart.</p>

<h3>The Lightning Network</h3>
<p>Another answer to the scaling problem came from two researchers, Joseph Poon and Thaddeus Dryja, who published the <b>Lightning Network</b> paper in 2015. The idea: two people open a payment channel by putting some bitcoin on the main chain. After that, they can send each other many tiny payments instantly and almost for free, with only the final result recorded on the main chain. It is like opening a bar tab. You order lots of drinks all night and settle one bill at closing time. Lightning started to go live in 2018.</p>

<h3>The 2017 mania</h3>
<p>In January 2017 a bitcoin cost about $1,000. By December the price had soared past $19,000. Why? A wave of new coins was sold in <b>ICOs</b>, or initial coin offerings, which let startups raise money by selling new tokens. The news was full of fortunes made overnight. In December 2017, two big U.S. exchanges, Cboe and CME, launched Bitcoin futures, which signaled to many that big finance was paying attention. On <b>December 17, 2017</b> the price peaked near $19,800.</p>

<h3>The crypto winter: 2018</h3>
<p>Then came the crash. Throughout 2018 the price fell month after month, and by December 2018 it bottomed near <b>$3,200</b>. That was a drop of around 84 percent from the peak. Many ICO projects turned out to be scams or went broke. People called this period a <b>crypto winter</b>. Even so, the network kept producing a block every ten minutes, without missing a beat.</p>

<h3>2019: a slow thaw</h3>
<p>Prices recovered partway in 2019, reaching nearly $14,000 in June before sliding back. In June 2019, the social media giant Facebook announced a plan for its own digital currency, Libra. Governments around the world suddenly started paying much closer attention to digital money. Libra never launched in the form first announced, but it made regulators think hard about cryptocurrencies.</p>

<h3>What the pattern teaches</h3>
<p>Look at the whole stretch from 2009 to 2019. Prices swung wildly. Companies failed. Experts called Bitcoin dead many times. Yet each time, the network kept running and the number of builders grew. A good habit for new learners is to separate the <b>price</b> from the <b>network</b>. The price is a mood. The network is a machine.</p>

<div class="callout"><p><b>Key takeaways.</b> Mt. Gox stopped withdrawals in February 2014, and about 850,000 bitcoins went missing. The second halving was on July 9, 2016. The block size debate showed that nobody is in charge. SegWit activated on August 24, 2017, and Bitcoin Cash split off on August 1, 2017. Lightning offers fast, cheap payments. The price peaked near $19,800 in December 2017 and fell to about $3,200 by December 2018.</p></div>
`,

title:"Wall Street Walks In (2020–2026)",
sub:"Pandemic money, companies and countries buying bitcoin, big collapses, ETFs and the road to $126,000.",
lesson:`
<h3>2020: a crash and a new story</h3>
<p>In March 2020, the COVID-19 pandemic shook markets all over the world. On <b>March 12, 2020</b>, often called Black Thursday, nearly everything sold off at once, and Bitcoin dropped about half in a day or so, to below $4,000. Then governments and central banks responded with huge amounts of new money and low interest rates. That fueled a new story: if governments can create so much money so quickly, maybe a scarce asset like Bitcoin is a good place to keep savings.</p>
<p>On <b>May 11, 2020</b>, Bitcoin had its third halving, which cut the block reward from 12.5 to <b>6.25 bitcoins</b>.</p>

<h3>Companies start buying</h3>
<p>In August 2020, a software company called MicroStrategy, led by Michael Saylor, did something new. It put about $250 million of its cash into bitcoin, buying 21,454 coins, and kept buying afterward. In October 2020, the payment company PayPal said its users could buy and sell crypto. In February 2021, the car company Tesla announced a $1.5 billion bitcoin purchase. And in April 2021, the exchange Coinbase became a public company on the Nasdaq stock market. Bitcoin was no longer just a hobby for tech fans.</p>

<h3>China bans mining, and Bitcoin shrugs</h3>
<p>In mid-2021, China ordered a ban on Bitcoin mining within its borders. China had been home to a large share of the world’s mining machines. The network’s total computing power, called the <b>hash rate</b>, dropped sharply. But the machines moved to other countries, including the United States and Kazakhstan, and the hash rate recovered within months. This was a real-life test: a major government tried to stop Bitcoin, and the network kept going.</p>

<h3>El Salvador makes Bitcoin legal tender</h3>
<p>On <b>September 7, 2021</b>, El Salvador became the first country to make Bitcoin legal tender, which means businesses had to be ready to accept it alongside the U.S. dollar. The government launched a digital wallet called Chivo and gave citizens a $30 bonus to try it. The idea was to lower the cost of sending money home from relatives abroad. The move was controversial. In January 2025, as part of an agreement with the International Monetary Fund, El Salvador changed the law so private businesses are no longer forced to accept Bitcoin, though the government kept its own holdings.</p>

<h3>The 2021 peak and Taproot</h3>
<p>On <b>November 10, 2021</b>, the price reached a new record of about $68,800. A few days later, on November 14, a software upgrade called <b>Taproot</b> went live. It improved privacy and made complicated transactions more efficient. It was the biggest upgrade since SegWit.</p>

<h3>2022: the great collapse of the middlemen</h3>
<p>In 2022, the whole crypto world went through a painful year, and most of the damage came from companies, not from Bitcoin itself.</p>
<ul>
<li><b>May 2022: Terra and Luna.</b> A so-called stablecoin named UST lost its link to the dollar and crashed, and its sister coin Luna went to nearly zero. Roughly forty billion dollars of value vanished.</li>
<li><b>Summer 2022: Celsius and Three Arrows Capital.</b> Lenders and funds that had taken huge risks went bankrupt.</li>
<li><b>November 2022: FTX.</b> FTX was one of the biggest exchanges, run by Sam Bankman-Fried. It filed for bankruptcy on November 11, 2022, after it was revealed that customer money had been used for other purposes. Bankman-Fried was convicted of fraud in November 2023 and later sentenced to 25 years in prison.</li>
</ul>
<p>The price of bitcoin fell to around $15,500, roughly 77 percent below the peak. Once again, “not your keys, not your coins” was proven right. People who kept their own coins did not lose them in these bankruptcies. People who left coins on these platforms often did.</p>

<h3>2024: the ETFs arrive</h3>
<p>An <b>ETF</b>, or exchange-traded fund, is an investment that you buy and sell through a normal brokerage account, like a stock. A <b>spot Bitcoin ETF</b> holds real bitcoin behind the scenes, and each share represents a slice of it. For years the U.S. Securities and Exchange Commission (SEC) said no. On <b>January 10, 2024</b>, the SEC approved a group of spot Bitcoin ETFs, and they began trading the next day. Large firms like BlackRock offered them, and billions of dollars poured in quickly. The trade-off is that ETF owners do not hold the keys. They hold shares that track the price.</p>
<p>On <b>April 20, 2024</b>, the fourth halving cut the reward to <b>3.125 bitcoins</b>. On December 5, 2024, the price crossed <b>$100,000</b> for the first time.</p>

<h3>2025: the Strategic Bitcoin Reserve and a new record</h3>
<p>On <b>March 6, 2025</b>, the U.S. president signed an executive order creating a <b>Strategic Bitcoin Reserve</b>, built from bitcoin that the government had already taken in criminal cases. It was a symbolic step: a major government was saying it would keep bitcoin, not sell it. On <b>October 6, 2025</b>, the price set an all-time high of about <b>$126,198</b>.</p>
<p>Only days later, on October 10, a market shock wiped out around $19 billion in borrowed-money bets in a single day. The price then slid through the end of the year.</p>

<h3>2026: another reminder</h3>
<p>Through 2026 the price kept sliding, falling to the neighborhood of $58,000 to $62,000 by mid-year, about half of the October 2025 record. In early November 2026, it was trading in the high $70,000s. Prices change daily, so always look up a live price instead of trusting a number in a course. What does not change is the pattern: Bitcoin has had several drops of 50 percent or more and then recovered to new highs each time so far. That is history, not a promise. The next halving is expected around April 2028, when the reward will drop to 1.5625 bitcoins.</p>

<div class="callout"><p><b>Key takeaways.</b> The third halving was on May 11, 2020. MicroStrategy and Tesla made companies buying bitcoin normal. China’s 2021 mining ban did not stop the network. El Salvador’s law took effect on September 7, 2021. FTX failed in November 2022. Spot ETFs were approved on January 10, 2024. The fourth halving was April 20, 2024. The all-time high was about $126,198 on October 6, 2025. Past performance is not a promise of future results.</p></div>
`,

n:7,
title:"How Bitcoin Works, Part 1: Keys, Wallets and Transactions",
sub:"What you really own, how a payment is built, and why fees depend on size and not on amount.",
lesson:`
<h3>Bitcoin is a ledger, not a pile of coins</h3>
<p>Many people picture bitcoin as little gold coins sitting inside a phone. That picture is wrong, and it causes lots of confusion. Bitcoin is a shared <b>ledger</b>: a public list that records who can spend what. There are no files to copy. Your “coins” are entries on that list. What you really hold is the power to unlock those entries, and that power comes from a secret.</p>

<h3>Units: bitcoins and satoshis</h3>
<p>You do not need to own a whole bitcoin. A bitcoin splits into 100 million tiny pieces. The smallest piece is called a <b>satoshi</b>, or “sat” for short. So <b>1 bitcoin = 100,000,000 satoshis</b>. If bitcoin costs $80,000, one satoshi is worth less than a tenth of a cent. People often buy a small amount, like $20 worth, and that is perfectly fine.</p>

<h3>Private keys, public keys and addresses</h3>
<p>When you create a Bitcoin wallet, your device makes a <b>private key</b>. It is a giant random number. It is so big that the number of possibilities is on the same enormous scale as the number of atoms in the universe, which is why nobody can guess one. From the private key, math produces a <b>public key</b>. From the public key, more math produces an <b>address</b>, which looks like a long string such as one starting with “bc1.” The math works in one direction only. You can go from private key to address, but nobody can go backward from an address to your private key.</p>
<p>Here is a good comparison. Your <b>address</b> is like your email address: you can give it to anyone who wants to send you something. Your <b>private key</b> is like your email password, except that there is no “forgot password” button and no company to call. Whoever has the private key controls the money.</p>

<h3>What a wallet really is</h3>
<p>A <b>wallet</b> is not a container of coins. It is a keychain. It stores your private keys, makes new addresses, and builds and signs transactions. The coins themselves always stay on the blockchain.</p>
<p>To make life easier, modern wallets create all your keys from one list of 12 or 24 ordinary words called a <b>seed phrase</b> or recovery phrase. The words come from a standard list of 2,048 words. If your phone breaks, you can type the words into a new wallet and all your keys come back. That is also why anyone who finds your words can take everything. We will talk about how to protect them in Section 9.</p>

<h3>The anatomy of a transaction</h3>
<p>A Bitcoin payment is a message that says: “I am taking these specific pieces of money that I own, and I am giving them to these new owners.” It has three main parts.</p>
<ul>
<li><b>Inputs.</b> These point to earlier payments that sent money to you and that you have not spent yet. They are called unspent transaction outputs, or <b>UTXOs</b>. Think of each one as a bill or a coin in your pocket.</li>
<li><b>Outputs.</b> These say how much goes to which new addresses.</li>
<li><b>Signatures.</b> You sign with your private key to prove you are allowed to spend those inputs.</li>
</ul>
<p>Here is the rule that surprises beginners: an input must be spent <i>entirely</i>. It is like paying for a $3 snack with a $5 bill. The cashier cannot tear the bill. You hand over the whole $5 and receive $2 in change. In Bitcoin, the “change” is sent back to a new address that you control.</p>

<h3>A worked example</h3>
<p>Maya has one UTXO worth 0.005 bitcoin. She wants to pay her friend Jordan 0.003 bitcoin. She sets a fee of 0.0001 bitcoin. Her wallet builds a transaction with one input of 0.005. It has two outputs: 0.003 to Jordan and 0.0019 back to Maya as change. If you add those up, 0.003 + 0.0019 = 0.0049. The missing 0.0001 is the fee. That leftover amount is picked up by the miner who includes the transaction in a block.</p>

<h3>How fees really work</h3>
<p>The fee is not a percentage of the amount. It depends on how much space the transaction takes up in a block, measured in bytes. A transaction with many inputs is larger and costs more. Sending $10 or $10 million takes roughly the same room if the shape is the same, so it costs roughly the same fee. When the network is busy, people bid higher fees to get into the next block first, a bit like paying for express shipping.</p>

<h3>From your wallet to the blockchain</h3>
<ol>
<li>Your wallet builds and signs the transaction.</li>
<li>It sends the transaction to a few nodes, which check it and pass it on to their neighbors. In a few seconds most of the network has heard about it.</li>
<li>Each node checks the rules: Are the signatures valid? Do the inputs really exist and are they still unspent? Do the outputs add up to no more than the inputs? A transaction that breaks a rule is thrown out.</li>
<li>Valid transactions wait in a place called the <b>mempool</b>, short for memory pool. It is a waiting room. Miners usually pick the ones with the best fee for their size first.</li>
<li>A miner places your transaction in a block. That is your first <b>confirmation</b>. Each new block built on top adds another confirmation.</li>
</ol>
<p>For small payments, people often accept one confirmation. For large amounts, many wait for six confirmations, which takes about an hour. This works because every extra block makes it much harder to rewrite, just like part 11 of the white paper showed.</p>

<h3>How double spending is stopped</h3>
<p>Remember the puzzle from Section 1? Here is the answer. If Maya tries to send the same UTXO to Jordan and to someone else, the network accepts only the first one it sees get confirmed. The second is rejected because its input is already spent. No bank is needed. The ledger itself, which everyone can check, is the referee.</p>

<h3>Public, but not by name</h3>
<p>Every transaction is visible to everyone forever. But addresses are not labeled with names. This is called <b>pseudonymous</b>, meaning it is like writing under a pen name. If someone learns that an address is yours, they can follow your history. That is why privacy-minded people use a fresh address for each payment, which most wallets do automatically.</p>

<h3>Payments cannot be reversed</h3>
<p>Once a Bitcoin transaction is buried under several blocks, it is final. There is no chargeback button and no customer service desk. That is good for stopping fraud against sellers, but it means you must double-check every address before you send.</p>

<div class="callout"><p><b>Key takeaways.</b> Bitcoin is a ledger, and a wallet is a keychain. 1 bitcoin equals 100 million satoshis. A seed phrase of 12 or 24 words can rebuild all your keys. Transactions have inputs, outputs and signatures, and inputs are spent whole with change returned to you. Fees depend on size, not amount. Confirmations make payments harder to reverse over time.</p></div>

sub:"The chain of fingerprints, the guessing game called mining, the 21 million cap and who really enforces the rules.",
lesson:`
<h3>Inside a block</h3>
<p>A <b>block</b> is a page in the ledger. It holds a batch of transactions, plus a small header on top. The header has a few key items: the fingerprint (hash) of the previous block, a fingerprint that summarizes all the transactions inside, a timestamp, a number that sets the difficulty, and a free number called the <b>nonce</b>. Nonce is short for “number used once,” and it is the number miners change over and over while they work.</p>
<p>The most important item is the link to the previous block. Because each block contains the fingerprint of the one before it, the blocks form a chain. Suppose someone changes a single transaction in an old block. That block’s fingerprint changes completely. The next block no longer matches, and neither does the one after that. To hide the change, the cheater would have to redo the work for that block and every block after it, while the honest network keeps adding new ones. That is why old history is almost impossible to rewrite.</p>
<p>A new block is added about every <b>10 minutes</b> on average. The word average matters. Sometimes two blocks come within a minute, and sometimes it takes an hour. That is the nature of luck.</p>

<h3>What mining actually is</h3>
<p><b>Mining</b> is a giant guessing game, and it works like this.</p>
<ol>
<li>A miner gathers transactions from the mempool and bundles them into a candidate block. The first transaction is special: it pays the miner the reward.</li>
<li>The miner runs the block header through the SHA-256 hash recipe. The result is a fingerprint.</li>
<li>The network has a target. The fingerprint must be lower than that target, which in practice means it must begin with a long string of zeros.</li>
<li>Nobody can predict a fingerprint. So the miner changes the nonce, hashes again, and checks again. And again. Today’s machines do this hundreds of trillions of times per second.</li>
<li>When one miner finally hits a fingerprint below the target, they broadcast the block. Every other computer can check the answer with one quick hash.</li>
</ol>
<p>A good comparison is rolling dice until you get a number lower than a very low target. There is no shortcut and no trick. The only way to win more often is to roll more dice, which means using more computing power and more electricity. That cost is the “work” in <b>proof of work</b>. The work is the proof that someone really spent effort on this block.</p>

<h3>The difficulty adjustment</h3>
<p>What if lots of new machines join and blocks start coming every 2 minutes? Bitcoin handles it automatically. Every <b>2,016 blocks</b>, which is about two weeks (2,016 × 10 minutes = 14 days), the network checks how long those blocks took. If they came too fast, the target is made harder. If they came too slow, the target is made easier. This keeps the pace near 10 minutes no matter how much computing power joins or leaves. It is a thermostat for the whole network.</p>

<h3>Mining machines and pools</h3>
<p>In 2009 you could mine with a home computer. Then people used graphics cards. Around 2013, companies created chips built only for the job, called <b>ASICs</b>, which stands for application-specific integrated circuits. They are incredibly fast at one task and useless for anything else. The whole network’s combined speed is the <b>hash rate</b>.</p>
<p>Because winning a block alone is like winning a lottery, many miners join <b>pools</b>. A pool combines everyone’s power and splits the rewards in proportion. That makes income steadier.</p>

<h3>The reward and the 21 million cap</h3>
<p>A miner who wins a block collects two things: the <b>block subsidy</b> (new bitcoins) and all the transaction fees in that block. The subsidy gets cut in half every <b>210,000 blocks</b>, roughly every four years.</p>
<ul>
<li>2009: 50 bitcoins per block</li>
<li>2012: 25</li>
<li>2016: 12.5</li>
<li>2020: 6.25</li>
<li>2024: 3.125</li>
<li>Around 2028: 1.5625</li>
</ul>
<p>Do the math for the first stretch: 210,000 blocks × 50 coins = 10.5 million bitcoins. That is already half of all bitcoins that will ever exist. Each period creates half as many as the one before, and the total approaches <b>21 million</b>. The last tiny fraction will be mined around the year 2140. After that, miners will be paid only by fees. As of this writing, more than 20 million bitcoins have already been mined.</p>
<p>Note: the 21 million cap is not a law of a government. It is a rule inside the software that every node enforces.</p>

<h3>Nodes: the referees</h3>
<p>A <b>node</b> is a computer running Bitcoin software. A <b>full node</b> downloads the whole blockchain and checks every rule for itself: Are the signatures real? Has any coin been spent twice? Is the block reward correct? Is the proof of work valid? If anything is wrong, the node rejects the block, even if a miner spent huge amounts to make it.</p>
<p>So here is the division of jobs. <b>Miners propose blocks. Nodes judge them.</b> A miner who tried to pay themselves 100 bitcoins instead of the allowed amount would waste their electricity, because every node would throw the block away. Thousands of independent nodes around the world keep the rules honest. Anyone can run one, even on a small home computer.</p>

<h3>Agreeing on one history</h3>
<p>Sometimes two miners find a block at almost the same moment. For a short time, part of the network sees one block and part sees the other. This is a temporary split. It is solved when the next block is found. Nodes follow the chain with the most accumulated work, and the losing block is dropped as a <b>stale block</b>. This is why more confirmations mean more safety. A transaction in a stale block simply goes back to waiting.</p>

<h3>The 51 percent attack</h3>
<p>What if one group controlled more than half of all the mining power? They could briefly out-build the honest miners. This is called a <b>51 percent attack</b>. They could reverse their own recent payments and block certain transactions. But look at what they still could not do. They could not steal coins from other people, because they do not have the private keys. They could not create extra coins beyond the rules, because nodes would reject the blocks. They could not change the rules. And the attack would be extremely expensive. Attackers would need to buy or rent a gigantic amount of machines and electricity. If it succeeded, trust in Bitcoin might fall, so the value of anything they held would fall too.</p>

<h3>The energy question</h3>
<p>Mining uses a lot of electricity, and critics call that wasteful. Supporters argue that the energy is what secures the network, the way guards and vaults cost money for a bank. They also point out that miners look for the cheapest power, which often means leftover or surplus energy that would otherwise go unused. This debate is ongoing, and a thoughtful learner should know both sides.</p>

<div class="callout"><p><b>Key takeaways.</b> Blocks link by fingerprints, so the past is nearly impossible to alter. Mining is a guessing game that costs real energy. Difficulty resets every 2,016 blocks to keep a 10-minute pace. Halvings occur every 210,000 blocks and the cap is 21 million. Miners propose blocks and nodes judge them. A 51 percent attack is costly and still cannot steal coins or break the rules.</p></div>
`,

n:9,
title:"Getting, Holding and Protecting Bitcoin",
sub:"Ways to buy, hot and cold wallets, seed phrase safety, the biggest scams, taxes and smart habits.",
lesson:`
<div class="callout"><p><b>Important.</b> This course is education, not financial, legal or tax advice. Bitcoin is volatile and you can lose money. Never put in more than you can afford to lose, and talk to a licensed professional about your own situation.</p></div>

<h3>Ways people get bitcoin</h3>
<ul>
<li><b>Exchanges.</b> Companies like Coinbase, Kraken and others let you link a bank account and buy. They must follow identity rules called <b>KYC</b>, short for “know your customer,” so you will upload an ID. This is the easiest way for most beginners.</li>
<li><b>Bitcoin ETFs.</b> You buy shares through a regular brokerage. You get price exposure but not the coins or the keys.</li>
<li><b>Peer-to-peer.</b> You trade directly with another person. This can be private, but you need to be careful about scams.</li>
<li><b>Bitcoin ATMs.</b> Machines that sell bitcoin for cash. They tend to charge much higher fees and are a favorite tool of scammers, so be careful.</li>
<li><b>Earning it.</b> Getting paid in bitcoin for work or selling something for it.</li>
<li><b>Mining.</b> Not realistic for beginners, because large companies with special machines dominate.</li>
</ul>

<h3>Dollar-cost averaging</h3>
<p>Because the price jumps around, many people buy a fixed dollar amount on a schedule, for example $25 every week, no matter what the price is. This is called <b>dollar-cost averaging</b>, or DCA. When the price is low your money buys more satoshis, and when it is high it buys fewer. It will not guarantee a profit, but it removes the pressure of trying to guess the perfect moment, which even professionals fail at.</p>

<h3>Custody: who holds the keys?</h3>
<p>This is the single most important idea in the section. <b>Custody</b> means who controls the private keys.</p>
<ul>
<li><b>Custodial.</b> A company, such as an exchange, holds the keys for you. It is convenient and you can reset your password, but you are trusting the company. Remember Mt. Gox and FTX.</li>
<li><b>Self-custody.</b> You hold the keys yourself. No one can freeze or lose your coins, but you alone are responsible. If you lose the keys and the backup, the money is gone forever.</li>
</ul>
<p>A sensible beginner path is to start on a reputable exchange with a small amount, learn how everything works, and then practice moving a small amount to your own wallet before you scale up.</p>

<h3>Hot wallets and cold wallets</h3>
<p>A <b>hot wallet</b> is connected to the internet, like an app on your phone. It is handy for small amounts, like the cash in your pocket. A <b>cold wallet</b> keeps keys offline. The most popular kind is a <b>hardware wallet</b>, a small device that stores your keys and signs transactions inside the device, so your keys never touch your computer. Think of it like the safe at home for the money you do not need to spend this week. Buy hardware wallets only straight from the maker, never from a stranger or a used listing, because a tampered device can steal from you.</p>

<h3>Protecting your seed phrase</h3>
<p>Your 12 or 24 recovery words are the master key to everything. Follow these rules.</p>
<ul>
<li>Write the words by hand on paper or stamp them in metal. Metal survives fire and floods.</li>
<li>Keep at least one backup in a separate safe place, such as a different location than your home.</li>
<li>Never take a photo of the words, never store them in notes, email or the cloud, and never type them into a website.</li>
<li>Never share them with anyone. Real support teams will never ask for your seed phrase.</li>
<li>Test your backup by restoring a small wallet before storing a large amount.</li>
</ul>
<p>Some people add an optional extra word or <b>passphrase</b> for more security. Others use <b>multisignature</b>, or multisig, which requires, for example, two out of three keys to approve a payment. That way losing one key, or having one stolen, is not a disaster.</p>

<h3>The most common scams</h3>
<ul>
<li><b>Giveaway scams.</b> “Send 1 bitcoin and get 2 back.” Real people never double your money.</li>
<li><b>Fake support.</b> Someone pretending to be from a wallet company or exchange asks for your seed phrase or tells you to install remote-control software.</li>
<li><b>Phishing.</b> Fake websites or emails that copy a real company. Always type the web address yourself or use a bookmark.</li>
<li><b>Romance and “pig-butchering” scams.</b> A stranger builds a friendship online for weeks, then convinces you to invest in a fake platform.</li>
<li><b>Address swapping and poisoning.</b> Malware or tricks that swap the address you copied for the attacker’s. Always check the first and last characters of the address before you confirm.</li>
<li><b>Recovery scams.</b> After you lose money, someone offers to recover it for a fee. They are scammers too.</li>
<li><b>Guaranteed returns.</b> No honest investment can guarantee profit. This one phrase should end the conversation.</li>
</ul>
<p>A simple rule: if you feel rushed, secretive or excited about a deal, stop. Scammers create urgency on purpose.</p>

<h3>A smart first send</h3>
<p>Before you send a large amount anywhere, send a tiny test amount first. Wait for it to arrive. Then send the rest. It costs a little extra in fees, but it can save you from a very expensive typing mistake.</p>

<h3>Taxes and records</h3>
<p>In the United States, the IRS treats bitcoin as property, not as currency. In general, selling it, trading it or spending it can trigger a taxable gain or loss depending on what you paid for it. Simply buying and holding is generally not a taxable event. Rules differ by country and change over time, so keep records of what you bought, when, and for how much, and ask a qualified tax professional.</p>

<h3>Lightning for everyday payments</h3>
<p>Remember Lightning from Section 5? Wallets that support it let you send small payments in seconds with very low fees. It is a good fit for tips, coffee-sized purchases and sending money across borders. The Lightning Network adds some new things to learn, so beginners should start slowly.</p>

<h3>Volatility and position size</h3>
<p>Bitcoin has dropped 50 to 80 percent several times. If you can’t imagine staying calm while your holdings fall by half, you have put in too much. Think about <b>position size</b>: the part of your overall money that you put into Bitcoin. Keep an emergency fund in regular savings first, pay high-interest debt, and only then consider Bitcoin with money you can leave alone for years.</p>

<div class="callout"><p><b>Key takeaways.</b> Custody means who holds the keys. Exchanges are convenient but custodial. A hardware wallet is a cold wallet. Protect your seed phrase on paper or metal, never in photos or the cloud, and never share it. Scammers use urgency and promises of guaranteed returns. Send a test amount first. Keep records for taxes. Size your position so you can sleep at night.</p></div>
`,

sub:"Digital gold, the best arguments for and against, real-world uses, community wealth and your next steps.",
lesson:`
<h3>Back to the three jobs of money</h3>
<p>In Section 1, we said money does three jobs: medium of exchange, store of value and unit of account. Let’s grade Bitcoin honestly on each job.</p>
<ul>
<li><b>Store of value.</b> This is the job Bitcoin is best known for. Its supply is capped at 21 million, so supporters call it “digital gold.” But its price swings are huge, so as a store of value it has worked best over long periods and has been painful over short ones.</li>
<li><b>Medium of exchange.</b> It works for sending value across the world, especially with Lightning. But most everyday shops still use cards or cash, so it is not common for daily spending.</li>
<li><b>Unit of account.</b> Prices are almost always still shown in dollars, partly because bitcoin’s price moves so much.</li>
</ul>
<p>So the honest scorecard is mixed, and that is why the discussion is still alive.</p>

<h3>The case in favor</h3>
<p>Supporters make several arguments.</p>
<ul>
<li><b>Hard-capped supply.</b> No central bank can create more. Nobody can inflate it away.</li>
<li><b>Open and borderless.</b> Anyone with a phone and internet can use it, with no permission. This matters to the unbanked.</li>
<li><b>Self-custody.</b> You can hold your own savings without a middleman who can freeze it.</li>
<li><b>Transparent rules.</b> Anyone can read the code and check the supply.</li>
<li><b>Resilience.</b> It has run nonstop since January 2009, through crashes, bans and hacks of companies.</li>
</ul>

<h3>The case against</h3>
<p>Critics also make strong points, and you should know them.</p>
<ul>
<li><b>Volatility.</b> Drops of more than 50 percent have happened several times, which makes it risky for savings you need soon.</li>
<li><b>No cash flow.</b> A business pays profits and a rental property pays rent. Bitcoin pays nothing by itself, so its value depends on what others will pay for it later.</li>
<li><b>Energy use.</b> Mining uses lots of electricity.</li>
<li><b>Crime and scams.</b> Criminals use it, and scams are common, although cash and banks are also used by criminals.</li>
<li><b>Concentration.</b> Early adopters and big holders own a large share of the supply.</li>
<li><b>Future risks.</b> Some worry about future quantum computers, which might one day break parts of today’s cryptography. Developers study upgrades to prepare for this.</li>
<li><b>Self-custody is hard.</b> Losing keys is permanent, and many people are not ready for that responsibility.</li>
</ul>
<p>A mature thinker holds both lists in mind. The case in favor and the case against can both contain truth.</p>

<h3>Where Bitcoin is used today</h3>
<ul>
<li><b>Savings in unstable economies.</b> People in countries with fast inflation use it to protect savings.</li>
<li><b>Sending money home.</b> Workers abroad can send value to family in minutes for low fees, especially using Lightning.</li>
<li><b>Investment portfolios.</b> ETFs, funds and some companies hold it as a long-term asset.</li>
<li><b>Governments.</b> El Salvador made it legal tender in 2021, and the United States created a Strategic Bitcoin Reserve in 2025 from seized coins.</li>
<li><b>Building blocks.</b> Developers are building tools on top, such as Lightning for payments.</li>
</ul>

<h3>Bitcoin and community wealth</h3>
<p>Remember Greenwood, the district called Black Wall Street? One thing that made it strong was that people in the community owned the banks, businesses and buildings, so money kept working inside the community. Block Wall Street teaches Bitcoin because it offers a different kind of toolkit: a savings system anyone can join without asking permission, a way to hold your own keys, and a way to build financial skills that families can pass down. Tools alone do not build wealth. Knowledge, discipline and community do. Bitcoin is a tool, and learning how to use it carefully is the part that makes the difference.</p>

<h3>Common myths to retire</h3>
<ul>
<li><b>“Bitcoin is anonymous.”</b> It is pseudonymous, and the public ledger can be traced.</li>
<li><b>“Bitcoin is only for criminals.”</b> Illegal use is a small share of activity, and it was never the design goal.</li>
<li><b>“Bitcoin is backed by nothing.”</b> It is backed by its rules, its network and the energy spent securing it. Whether that is worth a price is a market judgment.</li>
<li><b>“I missed it.”</b> No one can know the future. Learning, small steps and patience matter more than a feeling of being late.</li>
<li><b>“Someone can shut it down.”</b> Governments can restrict businesses in their country. Shutting down the whole network would mean silencing every node on earth.</li>
</ul>

<h3>Your next steps</h3>
<ol>
<li><b>Read the white paper.</b> It is nine pages and you now know all of its ideas. Open it and see how much you can follow on your own.</li>
<li><b>Practice safely.</b> Create a wallet and send a tiny test amount, around a few dollars, to learn the flow.</li>
<li><b>Write your backup plan.</b> Decide where a seed phrase would be kept, who might need to know in an emergency, and how you would handle it.</li>
<li><b>Set your rules.</b> Decide in advance how much you are willing to put in, and never invest money you need soon.</li>
<li><b>Keep learning.</b> Two well-known books are <i>The Bitcoin Standard</i> by Saifedean Ammous and <i>Mastering Bitcoin</i> by Andreas Antonopoulos, which is more technical. Watch for classes from Block Wall Street and the curriculum from Sun School of Satoshi.</li>
<li><b>Teach someone.</b> The best way to prove you know it is to explain it to a friend or family member in plain words.</li>
</ol>

<h3>A final thought</h3>
<p>In 2008, a nine-page paper asked whether people could send money to each other without a trusted middleman. Nobody is certain how the story will end. What you now have is something more valuable than a prediction: you understand where Bitcoin came from, how it works, how to protect yourself, and how to think about both sides. That puts you ahead of most people who have strong opinions about it. Next up is the final exam.</p>

<div class="callout"><p><b>Key takeaways.</b> Bitcoin scores best as a store of value over long periods and weaker as everyday money and unit of account. There are real arguments on both sides: scarcity and openness versus volatility, energy use and no cash flow. Myths such as “anonymous” and “backed by nothing” need correcting. Tools only help when paired with knowledge and discipline. Read the white paper, practice with tiny amounts, and keep learning.</p></div>
`,

var PRON=[[/UTXOs?/g,"U T X O"],[/ASICs/g,"A-sics"],[/ASIC/g,"A-sic"],[/\bKYC\b/g,"K Y C"],[/\bDCA\b/g,"D C A"],[/\bETFs\b/g,"E T Fs"],[/\bETF\b/g,"E T F"],[/\bSEC\b/g,"S E C"],[/\bICOs\b/g,"I C Os"],[/\bICO\b/g,"I C O"],[/\bUST\b/g,"U S T"],[/\bSHA-256\b/g,"S H A 256"],[/\bRSA\b/g,"R S A"],[/\bPGP\b/g,"P G P"],[/\bBTC\b/g,"bitcoin"],[/\bSegWit2x\b/g,"Seg Wit 2 x"],[/\bSegWit\b/g,"Seg Wit"],[/\bIRS\b/g,"I R S"],[/\bFTX\b/g,"F T X"],[/\bCME\b/g,"C M E"],[/\bCboe\b/g,"C B O E"],[/\bMt\. Gox\b/g,"Mount Gox"],[/\bGenesis\b/g,"Genesis"],[/\bsats?\b/g,"sats"],[/\bnonce\b/g,"non-sss"],[/bc1/g,"B C 1"]];
function loadVoices(){
  if(!TTS.ok)return;
  var all=speechSynthesis.getVoices()||[];
  TTS.voices=all.filter(function(v){return /^en/i.test(v.lang)});
  var saved=null;try{saved=localStorage.getItem("bws_voice")}catch(e){}
  var pick=null;
  if(saved)pick=TTS.voices.find(function(v){return v.name===saved});
  if(!pick){
    var order=[/Aria|Jenny|Michelle|Emma|Ana\b|Sonia|Libby/i,/Zira|Samantha|Karen|Moira|Tessa|Serena|Google US English|Female/i];
    for(var i=0;i<order.length&&!pick;i++){pick=TTS.voices.find(function(v){return order[i].test(v.name)})}
  }
  TTS.voice=pick||TTS.voices[0]||null;
  var sel=$("#voiceSel");
  if(sel){sel.innerHTML=TTS.voices.map(function(v){return '<option value="'+esc(v.name)+'"'+(TTS.voice&&v.name===TTS.voice.name?" selected":"")+'>'+esc(v.name)+'</option>'}).join("")}
}
if(TTS.ok){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function chunks(t){
  var out=[],parts=t.match(/[^.!?]+[.!?]+["”')\]]*\s*|[^.!?]+$/g)||[t];var cur="";
  parts.forEach(function(p){if((cur+p).length>170&&cur){out.push(cur);cur=p}else cur+=p});
  if(cur.trim())out.push(cur);return out;
}
function say(i){
  if(!TTS.ok)return;
  speechSynthesis.cancel();TTS.token++;var my=TTS.token;TTS.idx=i;TTS.state="play";TTS.armed=true;ui();
  speakUnit(my);
}
function speakUnit(my){
  if(my!==TTS.token)return;
  if(TTS.idx>=TTS.units.length){TTS.state="stop";TTS.idx=0;TTS.done=true;mark(null);ui();var s=SECTIONS[cur-1];if(s)checkGate(true);return}
  var el=TTS.units[TTS.idx];mark(el);
  var text=el.innerText.replace(/\s+/g," ");PRON.forEach(function(r){text=text.replace(r[0],r[1])});
  var parts=chunks(text),k=0;
  (function next(){
    if(my!==TTS.token)return;
    if(k>=parts.length){TTS.idx++;speakUnit(my);return}
    var u=new SpeechSynthesisUtterance(parts[k++]);
    if(TTS.voice)u.voice=TTS.voice;u.rate=TTS.rate;u.pitch=1.08;u.lang=(TTS.voice&&TTS.voice.lang)||"en-US";
    u.onend=next;u.onerror=function(e){if(my===TTS.token&&e.error!=="interrupted"&&e.error!=="canceled")next()};
    speechSynthesis.speak(u);
  })();
}
function mark(el){var o=document.querySelector(".speaking");if(o)o.classList.remove("speaking");if(el){el.classList.add("speaking");el.scrollIntoView({block:"center",behavior:"smooth"})}}
function stopSay(){if(!TTS.ok)return;TTS.token++;speechSynthesis.cancel();TTS.state="stop";TTS.idx=0;mark(null);ui()}
function pauseSay(){if(!TTS.ok)return;TTS.token++;speechSynthesis.cancel();TTS.state="pause";ui()}
function ui(){
  var p=$("#aPlay");if(!p)return;
  p.textContent=TTS.state==="play"?"⏸ Pause":(TTS.state==="pause"?"▶ Resume":"▶ Listen");
}
