name: Update data
on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh data files
        run: |
          python - <<'PY'
          #!/usr/bin/env python3
          """Refreshes data/btc-daily-BWSSite.js and data/housing-states-BWSSite.js. Standard library only."""
          import csv, io, json, os, urllib.request, datetime

          UA = {"User-Agent": "Mozilla/5.0 (compatible; BWS-data-update)"}
          OUT = "."
          os.makedirs(OUT, exist_ok=True)

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()

          # ---------- Bitcoin daily closes
          prices = {}
          try:
              txt = get("https://raw.githubusercontent.com/coinmetrics/data/master/csv/btc.csv").decode()
              for r in csv.DictReader(io.StringIO(txt)):
                  v = r.get("PriceUSD") or r.get("ReferenceRateUSD")
                  if v:
                      prices[r["time"]] = float(v)
              print("Coin Metrics rows:", len(prices))
          except Exception as e:
              print("Coin Metrics failed:", e)

          try:
              j = json.loads(get("https://query1.finance.yahoo.com/v8/finance/chart/BTC-USD?range=max&interval=1d"))
              res = j["chart"]["result"][0]
              for ts, c in zip(res["timestamp"], res["indicators"]["quote"][0]["close"]):
                  if c:
                      prices[datetime.datetime.utcfromtimestamp(ts).date().isoformat()] = float(c)
              print("Yahoo merged")
          except Exception as e:
              print("Yahoo failed:", e)

          try:
              j = json.loads(get("https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1440"))
              key = [k for k in j["result"] if k != "last"][0]
              for row in j["result"][key]:
                  prices[datetime.datetime.utcfromtimestamp(row[0]).date().isoformat()] = float(row[4])
              print("Kraken merged")
          except Exception as e:
              print("Kraken failed:", e)

          if prices:
              dates = sorted(prices)
              d0 = datetime.date.fromisoformat(dates[0]); d1 = datetime.date.fromisoformat(dates[-1])
              out, last, d = [], None, d0
              while d <= d1:
                  k = d.isoformat()
                  if k in prices: last = prices[k]
                  out.append(round(last, 4 if last < 10 else 2))
                  d += datetime.timedelta(days=1)
              payload = {"start": d0.isoformat(), "end": d1.isoformat(), "source": "Coin Metrics + Yahoo Finance", "prices": out}
              with open(os.path.join(OUT, "btc-daily-BWSSite.js"), "w") as f:
                  f.write("window.BTC_DATA=" + json.dumps(payload, separators=(",", ":")) + ";\n")
              print("Wrote btc-daily-BWSSite.js through", d1)

          # ---------- Zillow state home values
          ABBR = {"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT",
           "Delaware":"DE","District of Columbia":"DC","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL",
           "Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA",
           "Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV",
           "New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND",
           "Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD",
           "Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV",
           "Wisconsin":"WI","Wyoming":"WY"}
          try:
              url = "https://files.zillowstatic.com/research/public_csvs/zhvi/State_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv"
              rdr = csv.DictReader(io.StringIO(get(url).decode("utf-8-sig")))
              cols = [c for c in rdr.fieldnames if len(c) == 10 and c[4] == "-" and c >= "2014-01"]
              months = [c[:7] for c in cols]
              states = {}
              for r in rdr:
                  ab = ABBR.get(r["RegionName"])
                  if not ab: continue
                  vals = [round(float(r[c]), -1) if r[c] else None for c in cols]
                  states[ab] = {"name": r["RegionName"], "v": vals}
              payload = {"sample": False, "start": months[0], "end": months[-1], "source": "Zillow Home Value Index (ZHVI), all homes, smoothed and seasonally adjusted", "states": states}
              with open(os.path.join(OUT, "housing-states-BWSSite.js"), "w") as f:
                  f.write("window.HOUSING=" + json.dumps(payload, separators=(",", ":")) + ";\n")
              print("Wrote housing-states-BWSSite.js through", months[-1], "with", len(states), "states")
          except Exception as e:
              print("Zillow failed:", e)
          PY
      - name: Refresh news
        run: |
          python - <<'PY'
          import json, re, html, urllib.request, email.utils, datetime, xml.etree.ElementTree as ET
          SOURCES = [
              ("Cointelegraph", "https://cointelegraph.com/rss"),
              ("CoinDesk", "https://www.coindesk.com/arc/outboundfeeds/rss"),
              ("Decrypt", "https://decrypt.co/feed"),
              ("Bitcoin Magazine", "https://bitcoinmagazine.com/.rss/full/"),
          ]
          def clean(t, n=220):
              t = re.sub(r"<[^>]+>", " ", html.unescape(t or ""))
              t = re.sub(r"\s+", " ", t).strip()
              return t if len(t) <= n else t[:n].rsplit(" ", 1)[0] + "..."
          def parse_date(s):
              try:
                  d = email.utils.parsedate_to_datetime(s)
              except Exception:
                  try: d = datetime.datetime.fromisoformat((s or "").replace("Z", "+00:00"))
                  except Exception: return None
              if d.tzinfo is None: d = d.replace(tzinfo=datetime.timezone.utc)
              return d.astimezone(datetime.timezone.utc)
          def fetch(name, url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (BWS news updater)"})
              root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
              out = []
              for it in root.iter("item"):
                  d = parse_date(it.findtext("pubDate"))
                  link = (it.findtext("link") or "").strip()
                  title = clean(it.findtext("title"), 200)
                  if not (title and link and d): continue
                  out.append({"title": title, "link": link, "source": name, "date": d.isoformat(),
                              "summary": clean(it.findtext("description"))})
              return out[:15]
          items = []
          for name, url in SOURCES:
              try:
                  got = fetch(name, url); items += got; print(name, len(got))
              except Exception as e:
                  print("skip", name, e)
          if items:
              items.sort(key=lambda x: x["date"], reverse=True)
              items = items[:60]
              payload = {"updated": datetime.datetime.now(datetime.timezone.utc).isoformat(), "items": items}
              open("news-data-BWSSite.js", "w").write("// Auto-updated by the GitHub Action. Do not edit by hand.\nwindow.BWS_NEWS = " + json.dumps(payload) + ";\n")
          else:
              print("No items fetched; leaving news-data-BWSSite.js unchanged")
          PY
      - name: Save changes
        run: |
          git config user.name "bws-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add btc-daily-BWSSite.js housing-states-BWSSite.js news-data-BWSSite.js
          git diff --cached --quiet || (git commit -m "Update data" && git push)
